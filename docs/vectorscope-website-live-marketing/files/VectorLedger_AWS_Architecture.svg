<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Vector Ledger on AWS — as-built architecture</title>
  <desc id="desc">Cognito-authenticated SPA, Lambda/API Gateway control plane, DynamoDB proposals, ECS convert/apply, S3 GeoParquet and PMTiles lake.</desc>
  <defs>
    <style>
      .title { font: 700 28px Inter, Segoe UI, sans-serif; fill: #202124; }
      .caption { font: 500 15px Inter, Segoe UI, sans-serif; fill: #5f6368; }
      .box-title { font: 700 16px Inter, Segoe UI, sans-serif; fill: #202124; }
      .box-body { font: 400 13px Inter, Segoe UI, sans-serif; fill: #3c4043; }
      .lane { font: 700 12px Inter, Segoe UI, sans-serif; fill: #1A73E8; letter-spacing: 0.04em; }
      .arrow { stroke: #5f6368; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .future { font: 500 13px Inter, Segoe UI, sans-serif; fill: #5f6368; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#5f6368"/>
    </marker>
  </defs>
  <rect width="1400" height="900" fill="#F8F9FA"/>
  <text x="700" y="48" text-anchor="middle" class="title">Vector Ledger on AWS — as built</text>
  <text x="700" y="74" text-anchor="middle" class="caption">Cognito SPA · Lambda/API Gateway · DynamoDB proposals · ECS convert/apply · S3 GeoParquet + PMTiles</text>

  <!-- 1 Clients -->
  <rect x="40" y="110" width="280" height="160" rx="10" fill="#fff" stroke="#1A73E8" stroke-width="2"/>
  <text x="56" y="138" class="lane">1 · CLIENTS</text>
  <text x="56" y="168" class="box-title">Browser SPA</text>
  <text x="56" y="190" class="box-body">app.vectorscopeai.com</text>
  <text x="56" y="210" class="box-body">CloudFront + S3</text>
  <text x="56" y="238" class="box-title">Public playground</text>
  <text x="56" y="258" class="box-body">embed on vectorscopeai.com</text>

  <!-- 2 Auth & edge -->
  <rect x="360" y="110" width="300" height="160" rx="10" fill="#fff" stroke="#34A853" stroke-width="2"/>
  <text x="376" y="138" class="lane">2 · AUTH &amp; EDGE</text>
  <text x="376" y="168" class="box-title">Amazon Cognito</text>
  <text x="376" y="188" class="box-body">Sign-up / sign-in / email confirm</text>
  <text x="376" y="214" class="box-title">CloudFront + WAF</text>
  <text x="376" y="234" class="box-body">SPA + public routes; rate limit</text>
  <text x="376" y="258" class="box-body">SES sandbox invites</text>

  <!-- 3 API -->
  <rect x="700" y="110" width="320" height="160" rx="10" fill="#fff" stroke="#FBBC04" stroke-width="2"/>
  <text x="716" y="138" class="lane">3 · API / CONTROL PLANE</text>
  <text x="716" y="168" class="box-title">API Gateway HTTP → Lambda</text>
  <text x="716" y="190" class="box-body">Sandboxes · members · invites · jobs</text>
  <text x="716" y="210" class="box-body">Proposals · publish tokens · entitlements</text>
  <text x="716" y="236" class="box-title">DynamoDB</text>
  <text x="716" y="256" class="box-body">Changelog &amp; approvals; apply → new lake version</text>

  <!-- 4 Workers -->
  <rect x="1060" y="110" width="300" height="160" rx="10" fill="#fff" stroke="#EA4335" stroke-width="2"/>
  <text x="1076" y="138" class="lane">4 · CONVERT / APPLY</text>
  <text x="1076" y="168" class="box-title">ECS Fargate + ECR</text>
  <text x="1076" y="188" class="box-body">Image: convert</text>
  <text x="1076" y="214" class="box-title">Modes</text>
  <text x="1076" y="234" class="box-body">Shapefile → GeoParquet + PMTiles</text>
  <text x="1076" y="254" class="box-body">Proposal-ops apply (batch)</text>

  <!-- arrows top row -->
  <path class="arrow" d="M320,190 H350"/>
  <path class="arrow" d="M660,190 H690"/>
  <path class="arrow" d="M1020,190 H1050"/>

  <!-- 5 Lake -->
  <rect x="200" y="360" width="520" height="200" rx="10" fill="#fff" stroke="#1A73E8" stroke-width="2"/>
  <text x="216" y="390" class="lane">5 · LEDGER LAKE (STORAGE)</text>
  <text x="216" y="424" class="box-title">Private versioned S3 · vs-ledger-lake-*</text>
  <text x="216" y="452" class="box-body">Curated layer artifacts: GeoParquet + PMTiles (+ metadata)</text>
  <text x="216" y="478" class="box-body">Versioning = sandbox layer versions</text>
  <text x="216" y="498" class="box-body">+ S3 object versioning + proposal history</text>
  <text x="216" y="528" class="box-body">Not Iceberg tables today</text>

  <!-- 6 Consumers -->
  <rect x="780" y="360" width="480" height="200" rx="10" fill="#fff" stroke="#34A853" stroke-width="2"/>
  <text x="796" y="390" class="lane">6 · CONSUMERS</text>
  <text x="796" y="424" class="box-title">Web maps</text>
  <text x="796" y="444" class="box-body">PMTiles / TileJSON (MapLibre)</text>
  <text x="796" y="476" class="box-title">Desktop / analytics</text>
  <text x="796" y="496" class="box-body">GeoParquet download (presigned)</text>
  <text x="796" y="516" class="box-body">QGIS · ArcGIS Pro · DuckDB</text>
  <text x="796" y="544" class="future">Future (optional): Iceberg + Athena — not live</text>

  <!-- flow arrows mid -->
  <path class="arrow" d="M860,270 V340"/>
  <path class="arrow" d="M1210,270 V340 H1020"/>
  <path class="arrow" d="M460,270 V340"/>
  <path class="arrow" d="M720,460 H770"/>

  <!-- Workflow strip -->
  <rect x="40" y="620" width="1320" height="110" rx="10" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="60" y="654" class="lane">USER WORKFLOW</text>
  <text x="60" y="686" class="box-title">Sandbox → upload shapefile → convert → edit proposals → approve → batch apply → new lake version → publish GeoParquet / PMTiles</text>
  <text x="60" y="712" class="box-body">Collaborative editing · approvals · versioned GeoParquet</text>

  <!-- Future -->
  <rect x="40" y="760" width="1320" height="90" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="60" y="796" class="lane">ROADMAP (NOT SHIPPED)</text>
  <text x="60" y="826" class="future">Future: Iceberg table management and Athena analytics on the same GeoParquet lake.</text>
</svg>
