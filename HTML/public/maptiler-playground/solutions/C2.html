<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C2 — Globe Atmosphere</title>
  <script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"></script>
  <link href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    #map { position: absolute; inset: 0; width: 100%; height: 100%; }
    #err {
      display: none; position: absolute; z-index: 10; left: 12px; right: 12px; top: 12px;
      background: #7f1d1d; color: #fff; padding: 12px 14px; border-radius: 8px;
      font: 14px/1.4 system-ui, sans-serif; white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="err"></div>
  <div id="map"></div>
  <!-- From solutions/ the key file lives two levels up under public/ -->
  <script src="/admin-boundaries/js/config.js"></script>
  <script>
    function showErr(msg) {
      const el = document.getElementById('err');
      el.style.display = 'block';
      el.textContent = msg;
      console.error(msg);
    }

    const key = window.MAPTILER_API_KEY;
    if (!key || key === 'YOUR_MAPTILER_KEY_HERE') {
      showErr(
        'Missing MapTiler API key.\n\n' +
        'Copy HTML/public/admin-boundaries/js/config.example.js → config.js\n' +
        'and set window.MAPTILER_API_KEY.\n\n' +
        'This page is black until tiles can load — grading is static source checks only.'
      );
    } else {
      maptilersdk.config.apiKey = key;

      const map = new maptilersdk.Map({
        container: 'map',
        style: maptilersdk.MapStyle.SATELLITE,
        projection: 'globe',
        halo: true,
        space: true,
        center: [0, 20],
        zoom: 1.5,
        navigationControl: true,
        projectionControl: true,
      });

      map.on('error', (e) => {
        showErr('Map error: ' + (e && e.error && e.error.message ? e.error.message : String(e.error || e)));
      });

      map.on('load', () => {
        console.log('Globe ready — atmosphere (halo + space) enabled');
      });
    }
  </script>
</body>
</html>
