<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X6 — Schema Honest Outdoor</title>
  <script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"></script>
  <link href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0; width: 100%; height: 100%; }
    #note {
      position: absolute; z-index: 2; top: 12px; left: 12px;
      background: rgba(255,255,255,.92); padding: 10px 12px; border-radius: 8px;
      font-size: 12px; max-width: 280px;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
    }
  </style>
</head>
<body>
  <div id="note">
    OUTDOOR basemap + Contours (<code>contour</code>) and
    OpenMapTiles (<code>mountain_peak</code>) overlays — real schema names only.
  </div>
  <div id="map"></div>
  <script src="../admin-boundaries/js/config.js"></script>
  <script>
    const key = window.MAPTILER_API_KEY;
    if (!key) {
      throw new Error('Missing MAPTILER_API_KEY — set it in ../admin-boundaries/js/config.js');
    }
    maptilersdk.config.apiKey = key;

    const map = new maptilersdk.Map({
      container: 'map',
      style: maptilersdk.MapStyle.OUTDOOR,
      center: [8.6, 46.5],
      zoom: 11,
      pitch: 40,
      terrain: true,
      navigationControl: true,
    });

    function addOverlays() {
      // Contours tileset — source-layer "contour" (MapTiler Contours schema)
      if (!map.getSource('contours')) {
        map.addSource('contours', {
          type: 'vector',
          url: 'https://api.maptiler.com/tiles/contours/tiles.json?key=' + encodeURIComponent(key),
        });
      }
      if (!map.getLayer('overlay-contour')) {
        map.addLayer({
          id: 'overlay-contour',
          type: 'line',
          source: 'contours',
          'source-layer': 'contour',
          paint: {
            'line-color': '#8b5a2b',
            'line-width': [
              'case',
              ['==', ['%', ['get', 'nth_line'], 5], 0],
              1.4,
              0.6,
            ],
            'line-opacity': 0.85,
          },
        });
      }

      // Planet / OMT tiles — source-layer "mountain_peak"
      if (!map.getSource('planet')) {
        map.addSource('planet', {
          type: 'vector',
          url: 'https://api.maptiler.com/tiles/v3/tiles.json?key=' + encodeURIComponent(key),
        });
      }
      if (!map.getLayer('overlay-peaks')) {
        map.addLayer({
          id: 'overlay-peaks',
          type: 'circle',
          source: 'planet',
          'source-layer': 'mountain_peak',
          paint: {
            'circle-radius': 4,
            'circle-color': '#c0392b',
            'circle-stroke-width': 1,
            'circle-stroke-color': '#fff',
          },
        });
      }

      // Outdoor tileset — documented source-layer "trail" (hiking paths)
      if (!map.getSource('outdoor')) {
        map.addSource('outdoor', {
          type: 'vector',
          url: 'https://api.maptiler.com/tiles/outdoor/tiles.json?key=' + encodeURIComponent(key),
        });
      }
      if (!map.getLayer('overlay-trail')) {
        map.addLayer({
          id: 'overlay-trail',
          type: 'line',
          source: 'outdoor',
          'source-layer': 'trail',
          paint: {
            'line-color': '#27ae60',
            'line-width': 2,
            'line-opacity': 0.9,
          },
        });
      }
    }

    map.on('load', addOverlays);
    map.on('style.load', addOverlays);
  </script>
</body>
</html>
