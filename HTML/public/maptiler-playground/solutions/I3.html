<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I3 — GeoSplats WebGPU</title>
  <link rel="stylesheet" href="https://cdn.maptiler.com/maptiler-geosplats/v1.0.4/maptiler-geosplats.css" />
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100vh; }
    #webGpuError {
      display: none;
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(180, 40, 40, 0.95);
      color: #fff;
      padding: 14px 22px;
      border-radius: 8px;
      z-index: 9999;
      max-width: 90vw;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0,0,0,.25);
    }
  </style>
</head>
<body>
  <div id="webGpuError"></div>
  <div id="map"></div>
  <script src="../admin-boundaries/js/config.js"></script>
  <script type="module">
    import {
      Map,
      SplatModel,
      config,
    } from 'https://cdn.maptiler.com/maptiler-geosplats/v1.0.4/maptiler-geosplats.mjs';

    const key = window.MAPTILER_API_KEY;
    if (!key) {
      throw new Error('Missing MAPTILER_API_KEY — set it in ../admin-boundaries/js/config.js');
    }

    const errorOverlay = document.getElementById('webGpuError');

    if (!navigator.gpu) {
      errorOverlay.style.display = 'block';
      errorOverlay.textContent =
        'WebGPU is not supported by your browser. Please use a compatible browser (Chrome, Edge, or Firefox with WebGPU enabled) to view 3D GeoSplats.';
    }

    config.apiKey = key;

    // Public example model id from MapTiler GeoSplats SDK docs (SplatModel class)
    const EXAMPLE_MODEL_ID = '7d943f61-56fc-44fe-aa9e-db4afa115813';
    const CENTER = [14.418269, 50.095494];

    const map = new Map({
      apiKey: key,
      container: 'map',
      center: CENTER,
      zoom: 16,
      pitch: 50,
    });

    map.on('load', () => {
      if (!navigator.gpu) return;
      const splatModel = new SplatModel({
        model: EXAMPLE_MODEL_ID,
        center: CENTER,
        opacity: 1,
      });
      map.addSplatModel(splatModel);
    });

    map.on('splatmodelerror', (e) => {
      errorOverlay.style.display = 'block';
      errorOverlay.textContent =
        'Failed to load SplatModel: ' + (e?.error?.message || 'unknown error');
    });
  </script>
</body>
</html>
