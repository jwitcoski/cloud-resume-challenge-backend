<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C10 — Static Snapshot</title>
  <script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"></script>
  <link href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0; width: 100%; height: 100%; }
    #shot {
      position: absolute; z-index: 2; right: 12px; bottom: 12px;
      background: #fff; padding: 10px; border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,.18); max-width: 340px;
    }
    #shot img { display: block; width: 320px; height: auto; border-radius: 6px; }
    #shot button { margin-top: 8px; padding: 6px 10px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="shot">
    <div style="font-size:13px;margin-bottom:6px;">Static snapshot</div>
    <img id="staticImg" alt="Static map snapshot" width="320" height="200" />
    <button id="refresh" type="button">Refresh from viewport</button>
  </div>
  <script src="/admin-boundaries/js/config.js"></script>
  <script>
    const key = window.MAPTILER_API_KEY;
    if (!key) {
      throw new Error('Missing MAPTILER_API_KEY — set it in /admin-boundaries/js/config.js');
    }
    maptilersdk.config.apiKey = key;

    const img = document.getElementById('staticImg');

    const map = new maptilersdk.Map({
      container: 'map',
      style: maptilersdk.MapStyle.STREETS,
      center: [14.4178, 50.1167],
      zoom: 12,
      navigationControl: true,
    });

    async function updateStatic() {
      const center = map.getCenter();
      const zoom = Math.round(map.getZoom());
      const url = await maptilersdk.staticMaps.centered(
        [center.lng, center.lat],
        zoom,
        {
          width: 640,
          height: 400,
          hiDPI: true,
          style: maptilersdk.MapStyle.OUTDOOR,
        }
      );
      img.src = typeof url === 'string' ? url : (url?.href || String(url));
    }

    map.on('load', updateStatic);
    map.on('moveend', updateStatic);
    document.getElementById('refresh').addEventListener('click', updateStatic);
  </script>
</body>
</html>
