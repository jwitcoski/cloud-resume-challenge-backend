<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I1 — Cesium Globe</title>
  <!-- CESIUM_BASE_URL must be set before Cesium.js loads (workers / Assets / Widgets) -->
  <script>
    window.CESIUM_BASE_URL =
      'https://cdn.jsdelivr.net/npm/cesium@1.141.0/Build/Cesium/';
  </script>
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.141.0/Build/Cesium/Cesium.js"></script>
  <link
    href="https://cdn.jsdelivr.net/npm/cesium@1.141.0/Build/Cesium/Widgets/widgets.css"
    rel="stylesheet"
  />
  <style>
    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }
    #creditLogo {
      position: absolute;
      right: 10px;
      bottom: 10px;
      z-index: 999;
    }
    #err {
      display: none;
      position: absolute;
      z-index: 1000;
      left: 12px;
      right: 12px;
      top: 12px;
      background: #7f1d1d;
      color: #fff;
      padding: 12px 14px;
      border-radius: 8px;
      font: 14px/1.4 system-ui, sans-serif;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="err"></div>
  <div id="cesiumContainer"></div>
  <a id="creditLogo" href="https://www.maptiler.com/" target="_blank" rel="noopener">
    <img src="https://api.maptiler.com/resources/logo.svg" alt="MapTiler" />
  </a>
  <script src="/admin-boundaries/js/config.js"></script>
  <script>
    function showErr(msg) {
      const el = document.getElementById('err');
      el.style.display = 'block';
      el.textContent = msg;
      console.error(msg);
    }

    // Cesium only — do not mix MapLibre / MapTiler SDK Map APIs here
    (async function main() {
      if (typeof Cesium === 'undefined') {
        showErr('CesiumJS failed to load (check CDN / network).');
        return;
      }

      const key = window.MAPTILER_API_KEY;
      if (!key || key === 'YOUR_MAPTILER_KEY_HERE') {
        showErr(
          'Missing MAPTILER_API_KEY — set it in /admin-boundaries/js/config.js'
        );
        return;
      }

      // Avoid Ion default-layer prompts; we supply MapTiler imagery + terrain
      Cesium.Ion.defaultAccessToken = undefined;

      try {
        const terrainProvider = await Cesium.CesiumTerrainProvider.fromUrl(
          'https://api.maptiler.com/tiles/terrain-quantized-mesh-v2/?key=' +
            encodeURIComponent(key),
          { requestVertexNormals: true }
        );

        const imageryProvider = new Cesium.UrlTemplateImageryProvider({
          url:
            'https://api.maptiler.com/maps/satellite-v4/{z}/{x}/{y}.jpg?key=' +
            encodeURIComponent(key),
          minimumLevel: 0,
          maximumLevel: 20,
          credit: new Cesium.Credit(
            '<a href="https://www.maptiler.com/copyright/" target="_blank">&copy; MapTiler</a> ' +
              '<a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>',
            true
          ),
        });

        const viewer = new Cesium.Viewer('cesiumContainer', {
          animation: false,
          timeline: false,
          baseLayerPicker: false,
          geocoder: false,
          homeButton: true,
          sceneModePicker: true,
          navigationHelpButton: false,
          imageryProvider: false,
          baseLayer: new Cesium.ImageryLayer(imageryProvider),
          terrainProvider,
        });

        viewer.camera.setView({
          destination: Cesium.Cartesian3.fromDegrees(14.4178, 50.1167, 2_500_000),
        });
      } catch (err) {
        showErr('Cesium init failed: ' + (err && err.message ? err.message : err));
      }
    })();
  </script>
</body>
</html>
