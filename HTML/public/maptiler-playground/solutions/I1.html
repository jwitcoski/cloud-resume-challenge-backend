<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I1 — Cesium Globe</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.141.0/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.141.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <style>
    html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    #creditLogo {
      position: absolute; right: 10px; bottom: 10px; z-index: 999;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <a id="creditLogo" href="https://www.maptiler.com/" target="_blank" rel="noopener">
    <img src="https://api.maptiler.com/resources/logo.svg" alt="MapTiler" />
  </a>
  <script src="../admin-boundaries/js/config.js"></script>
  <script>
    const key = window.MAPTILER_API_KEY;
    if (!key) {
      throw new Error('Missing MAPTILER_API_KEY — set it in ../admin-boundaries/js/config.js');
    }

    // Cesium only — do not mix MapLibre / MapTiler SDK Map APIs here
    const viewer = new Cesium.Viewer('cesiumContainer', {
      animation: false,
      timeline: false,
      baseLayerPicker: false,
      geocoder: false,
      homeButton: true,
      sceneModePicker: true,
      navigationHelpButton: false,
      terrain: new Cesium.Terrain(
        Cesium.CesiumTerrainProvider.fromUrl(
          'https://api.maptiler.com/tiles/terrain-quantized-mesh-v2/?key=' + encodeURIComponent(key),
          { requestVertexNormals: true }
        )
      ),
      baseLayer: new Cesium.ImageryLayer(
        new Cesium.UrlTemplateImageryProvider({
          url: 'https://api.maptiler.com/maps/satellite-v4/{z}/{x}/{y}.jpg?key=' + encodeURIComponent(key),
          minimumLevel: 0,
          maximumLevel: 20,
          credit: new Cesium.Credit(
            '<a href="https://www.maptiler.com/copyright/" target="_blank">&copy; MapTiler</a> ' +
            '<a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>',
            true
          ),
        })
      ),
    });

    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(14.4178, 50.1167, 2_500_000),
    });
  </script>
</body>
</html>
