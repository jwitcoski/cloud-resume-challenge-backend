<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X2 — City Extrude Survive</title>
  <script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"></script>
  <link href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0; width: 100%; height: 100%; }
    #toggle {
      position: absolute; z-index: 2; top: 12px; left: 12px;
      display: flex; gap: 8px;
    }
    #toggle button {
      padding: 8px 12px; border: 0; border-radius: 6px; cursor: pointer;
      background: #111; color: #fff; font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="toggle">
    <button type="button" data-style="HYBRID">Hybrid</button>
    <button type="button" data-style="STREETS">Streets</button>
  </div>
  <div id="map"></div>
  <script src="/admin-boundaries/js/config.js"></script>
  <script>
    const key = window.MAPTILER_API_KEY;
    if (!key) {
      throw new Error('Missing MAPTILER_API_KEY — set it in /admin-boundaries/js/config.js');
    }
    maptilersdk.config.apiKey = key;

    const map = new maptilersdk.Map({
      container: 'map',
      style: maptilersdk.MapStyle.HYBRID,
      center: [-74.006, 40.7128],
      zoom: 15.2,
      pitch: 60,
      bearing: -20,
      navigationControl: true,
    });

    map.on('error', (e) => console.error('Map error', e && e.error));

    function labelBeforeId() {
      const layers = map.getStyle().layers || [];
      for (const layer of layers) {
        if (layer.type === 'symbol' && layer.layout && layer.layout['text-field']) {
          return layer.id;
        }
      }
      return undefined;
    }

    function addExtrusions() {
      if (map.getLayer('nyc-extrusions')) {
        map.removeLayer('nyc-extrusions');
      }
      if (map.getSource('nyc-buildings')) {
        map.removeSource('nyc-buildings');
      }

      map.addSource('nyc-buildings', {
        type: 'vector',
        url: 'https://api.maptiler.com/tiles/buildings/tiles.json?key=' + encodeURIComponent(key),
      });

      map.addLayer({
        id: 'nyc-extrusions',
        type: 'fill-extrusion',
        source: 'nyc-buildings',
        'source-layer': 'building',
        minzoom: 14,
        paint: {
          'fill-extrusion-color': [
            'coalesce',
            ['get', 'facade_color'],
            '#d4c4a8',
          ],
          'fill-extrusion-height': ['coalesce', ['get', 'height'], ['get', 'render_height'], 12],
          'fill-extrusion-base': ['coalesce', ['get', 'height_min'], ['get', 'render_min_height'], 0],
          'fill-extrusion-opacity': 0.9,
        },
      }, labelBeforeId());
    }

    map.on('load', addExtrusions);
    map.on('style.load', addExtrusions);

    document.querySelectorAll('#toggle button').forEach((btn) => {
      btn.addEventListener('click', () => {
        const style =
          btn.dataset.style === 'STREETS'
            ? maptilersdk.MapStyle.STREETS
            : maptilersdk.MapStyle.HYBRID;
        map.setStyle(style);
        // Extrusions re-added on style.load
      });
    });
  </script>
</body>
</html>
