<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C4 — Style Switcher v4</title>
  <script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"></script>
  <link href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0; width: 100%; height: 100%; }
    #styles {
      position: absolute; z-index: 2; top: 12px; left: 12px;
      display: flex; gap: 6px; flex-wrap: wrap;
    }
    #styles button {
      border: 0; padding: 8px 12px; border-radius: 6px; cursor: pointer;
      background: #111; color: #fff; font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="styles">
    <button type="button" data-style="STREETS">Streets</button>
    <button type="button" data-style="HYBRID">Hybrid</button>
    <button type="button" data-style="OUTDOOR">Outdoor</button>
    <button type="button" data-style="DATAVIZ_DARK">Dataviz Dark</button>
  </div>
  <div id="map"></div>
  <script src="/admin-boundaries/js/config.js"></script>
  <script>
    const key = window.MAPTILER_API_KEY;
    if (!key) {
      throw new Error('Missing MAPTILER_API_KEY — set it in /admin-boundaries/js/config.js');
    }
    maptilersdk.config.apiKey = key;

    const STYLES = {
      STREETS: maptilersdk.MapStyle.STREETS,
      HYBRID: maptilersdk.MapStyle.HYBRID,
      OUTDOOR: maptilersdk.MapStyle.OUTDOOR,
      DATAVIZ_DARK: maptilersdk.MapStyle.DATAVIZ.DARK,
    };

    const map = new maptilersdk.Map({
      container: 'map',
      style: maptilersdk.MapStyle.STREETS,
      center: [14.4178, 50.1167],
      zoom: 11,
      navigationControl: true,
    });

    function addCustomLayers() {
      if (map.getSource('demo-point')) return;
      map.addSource('demo-point', {
        type: 'geojson',
        data: {
          type: 'FeatureCollection',
          features: [{
            type: 'Feature',
            geometry: { type: 'Point', coordinates: [14.4178, 50.1167] },
            properties: { name: 'Prague' },
          }],
        },
      });
      map.addLayer({
        id: 'demo-circle',
        type: 'circle',
        source: 'demo-point',
        paint: {
          'circle-radius': 10,
          'circle-color': '#e74c3c',
          'circle-stroke-width': 2,
          'circle-stroke-color': '#fff',
        },
      });
    }

    function onStyleReady() {
      addCustomLayers();
    }

    map.on('load', onStyleReady);
    map.on('style.load', onStyleReady);

    document.querySelectorAll('#styles button').forEach((btn) => {
      btn.addEventListener('click', () => {
        const next = STYLES[btn.dataset.style];
        map.setStyle(next);
      });
    });
  </script>
</body>
</html>
