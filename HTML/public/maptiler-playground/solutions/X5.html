<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X5 — Search Then Reverse</title>
  <script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"></script>
  <link href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0; width: 100%; height: 100%; }
    #ui {
      position: absolute; z-index: 2; top: 12px; left: 12px;
      background: #fff; padding: 10px; border-radius: 8px;
      box-shadow: 0 2px 10px rgba(0,0,0,.14); width: 300px;
    }
    #q { width: 100%; box-sizing: border-box; padding: 8px; margin-bottom: 6px; }
    #status { font-size: 12px; color: #444; min-height: 2.5em; }
  </style>
</head>
<body>
  <div id="ui">
    <input id="q" type="search" placeholder="Search (forward geocode)…" />
    <button id="search" type="button">Search</button>
    <div id="status">Click map for reverse geocode (debounced).</div>
  </div>
  <div id="map"></div>
  <script src="../admin-boundaries/js/config.js"></script>
  <script>
    const key = window.MAPTILER_API_KEY;
    if (!key) {
      throw new Error('Missing MAPTILER_API_KEY — set it in ../admin-boundaries/js/config.js');
    }
    maptilersdk.config.apiKey = key;

    const statusEl = document.getElementById('status');
    let marker;
    let reverseTimer = null;

    const map = new maptilersdk.Map({
      container: 'map',
      style: maptilersdk.MapStyle.STREETS,
      center: [14.4178, 50.1167],
      zoom: 11,
      navigationControl: true,
    });

    function placeMarker(lngLat, label) {
      if (!marker) marker = new maptilersdk.Marker({ color: '#8e44ad' }).addTo(map);
      marker.setLngLat(lngLat);
      if (label) {
        marker.setPopup(new maptilersdk.Popup().setText(label)).togglePopup();
      }
    }

    async function doForward() {
      const query = document.getElementById('q').value.trim();
      if (!query) return;
      statusEl.textContent = 'Forward geocoding…';
      try {
        const res = await maptilersdk.geocoding.forward(query, { limit: 1 });
        const f = res?.features?.[0];
        if (!f) {
          statusEl.textContent = 'No matches.';
          return;
        }
        const [lng, lat] = f.geometry.coordinates;
        const label = f.place_name || f.text || query;
        placeMarker([lng, lat], label);
        map.flyTo({ center: [lng, lat], zoom: 14, duration: 1800 });
        statusEl.textContent = 'Found: ' + label;
      } catch (err) {
        statusEl.textContent = 'Forward failed: ' + (err.message || err);
      }
    }

    document.getElementById('search').addEventListener('click', doForward);
    document.getElementById('q').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doForward();
    });

    function debounceReverse(lngLat) {
      if (reverseTimer) clearTimeout(reverseTimer);
      reverseTimer = setTimeout(async () => {
        statusEl.textContent = 'Reverse…';
        try {
          const res = await maptilersdk.geocoding.reverse([lngLat.lng, lngLat.lat]);
          const f = res?.features?.[0];
          const label = f?.place_name || f?.text || 'Unknown';
          placeMarker([lngLat.lng, lngLat.lat], label);
          statusEl.textContent =
            'Reverse @ [' + lngLat.lng.toFixed(5) + ', ' + lngLat.lat.toFixed(5) + ']: ' + label;
        } catch (err) {
          statusEl.textContent = 'Reverse failed: ' + (err.message || err);
        }
      }, 350);
    }

    map.on('click', (e) => debounceReverse(e.lngLat));
  </script>
</body>
</html>
