<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C8 — Weather Layer</title>
  <script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"></script>
  <link href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css" rel="stylesheet" />
  <script src="https://cdn.maptiler.com/maptiler-weather/3.1.1/maptiler-weather.umd.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0; width: 100%; height: 100%; }
    #info {
      position: absolute; z-index: 2; top: 12px; left: 12px;
      background: rgba(0,0,0,.7); color: #fff; padding: 10px 12px; border-radius: 8px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="info">Wind layer (@maptiler/weather 3.1.1) — move cursor to sample speed</div>
  <div id="map"></div>
  <script src="../admin-boundaries/js/config.js"></script>
  <script>
    const key = window.MAPTILER_API_KEY;
    if (!key) {
      throw new Error('Missing MAPTILER_API_KEY — set it in ../admin-boundaries/js/config.js');
    }
    maptilersdk.config.apiKey = key;

    const info = document.getElementById('info');

    const map = new maptilersdk.Map({
      container: 'map',
      style: maptilersdk.MapStyle.BACKDROP,
      center: [0, 40],
      zoom: 2,
      projection: 'globe',
      navigationControl: true,
    });

    const weatherLayer = new maptilerweather.WindLayer();

    map.on('load', () => {
      map.addLayer(weatherLayer);
      weatherLayer.animateByFactor(3600);
    });

    map.on('mousemove', (e) => {
      const value = weatherLayer.pickAt(e.lngLat.lng, e.lngLat.lat);
      if (!value) {
        info.textContent = 'Wind — no sample at cursor';
        return;
      }
      info.textContent =
        'Wind: ' + value.speedMetersPerSecond.toFixed(1) + ' m/s @ [' +
        e.lngLat.lng.toFixed(2) + ', ' + e.lngLat.lat.toFixed(2) + ']';
    });
  </script>
</body>
</html>
