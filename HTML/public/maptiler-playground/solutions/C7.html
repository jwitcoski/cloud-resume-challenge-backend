<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C7 — 3D Buildings</title>
  <script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"></script>
  <link href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; }
    #map { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="../admin-boundaries/js/config.js"></script>
  <script>
    const key = window.MAPTILER_API_KEY;
    if (!key) {
      throw new Error('Missing MAPTILER_API_KEY — set it in ../admin-boundaries/js/config.js');
    }
    maptilersdk.config.apiKey = key;

    const map = new maptilersdk.Map({
      container: 'map',
      style: maptilersdk.MapStyle.STREETS,
      center: [-74.006, 40.7128],
      zoom: 15.5,
      pitch: 60,
      bearing: -17,
      navigationControl: true,
    });

    function getLabelLayerId() {
      const layers = map.getStyle().layers || [];
      for (const layer of layers) {
        if (layer.type === 'symbol' && layer.layout && layer.layout['text-field']) {
          return layer.id;
        }
      }
      return undefined;
    }

    function addBuildings() {
      if (map.getLayer('3d-buildings')) return;

      const beforeId = getLabelLayerId();

      // Prefer specialized buildings tileset (height / height_min)
      if (!map.getSource('maptiler-buildings')) {
        map.addSource('maptiler-buildings', {
          type: 'vector',
          url: 'https://api.maptiler.com/tiles/buildings/tiles.json?key=' + key,
        });
      }

      map.addLayer({
        id: '3d-buildings',
        source: 'maptiler-buildings',
        'source-layer': 'building',
        type: 'fill-extrusion',
        minzoom: 14,
        paint: {
          'fill-extrusion-color': [
            'coalesce',
            ['get', 'facade_color'],
            'hsl(35, 20%, 70%)',
          ],
          'fill-extrusion-height': ['coalesce', ['get', 'height'], ['get', 'render_height'], 10],
          'fill-extrusion-base': ['coalesce', ['get', 'height_min'], ['get', 'render_min_height'], 0],
          'fill-extrusion-opacity': 0.85,
        },
      }, beforeId);
    }

    map.on('load', addBuildings);
    map.on('style.load', addBuildings);

    map.on('click', '3d-buildings', (e) => {
      const f = e.features && e.features[0];
      if (!f) return;
      const h = f.properties.height || f.properties.render_height;
      new maptilersdk.Popup()
        .setLngLat(e.lngLat)
        .setHTML('<strong>Building</strong><br/>height: ' + (h ?? 'n/a') + ' m')
        .addTo(map);
    });
  </script>
</body>
</html>
