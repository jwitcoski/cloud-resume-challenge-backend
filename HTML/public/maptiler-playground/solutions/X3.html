<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X3 — Store Locator 5k</title>
  <script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"></script>
  <link href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0; width: 100%; height: 100%; }
    #controls {
      position: absolute; z-index: 2; top: 12px; left: 12px;
      background: #fff; padding: 10px; border-radius: 8px;
      box-shadow: 0 2px 10px rgba(0,0,0,.12);
    }
  </style>
</head>
<body>
  <div id="controls">
    <div>~5000 stores — cluster at low zoom</div>
    <label><input id="togHeat" type="checkbox" /> Show heatmap</label>
  </div>
  <div id="map"></div>
  <script src="/admin-boundaries/js/config.js"></script>
  <script>
    const key = window.MAPTILER_API_KEY;
    if (!key) {
      throw new Error('Missing MAPTILER_API_KEY — set it in /admin-boundaries/js/config.js');
    }
    maptilersdk.config.apiKey = key;

    // Simulate ~5000 store locations across CONUS [lng, lat]
    const stores = { type: 'FeatureCollection', features: [] };
    for (let i = 0; i < 5000; i++) {
      const lng = -124 + Math.random() * 58;
      const lat = 25 + Math.random() * 24;
      stores.features.push({
        type: 'Feature',
        properties: { id: i, name: 'Store #' + i },
        geometry: { type: 'Point', coordinates: [lng, lat] },
      });
    }

    const map = new maptilersdk.Map({
      container: 'map',
      style: maptilersdk.MapStyle.STREETS,
      center: [-98.5, 39.8],
      zoom: 3.5,
      navigationControl: true,
    });

    let heatmapOn = false;

    async function addLayers() {
      if (map.getSource('stores')) return;

      await maptilersdk.helpers.addPoint(map, {
        data: stores,
        cluster: true,
        showLabel: true,
        pointColor: '#27ae60',
        pointRadius: 5,
      });

      map.addSource('stores-heat', {
        type: 'geojson',
        data: stores,
      });
      map.addLayer({
        id: 'stores-heatmap',
        type: 'heatmap',
        source: 'stores-heat',
        layout: { visibility: 'none' },
        paint: {
          'heatmap-weight': 1,
          'heatmap-intensity': 1.2,
          'heatmap-radius': 18,
          'heatmap-opacity': 0.75,
        },
      });

      // Popup on unclustered / helper point click
      map.on('click', (e) => {
        const feats = map.queryRenderedFeatures(e.point);
        const hit = feats.find((f) => f.properties && f.properties.name);
        if (!hit) return;
        new maptilersdk.Popup()
          .setLngLat(hit.geometry.coordinates)
          .setHTML('<strong>' + hit.properties.name + '</strong>')
          .addTo(map);
      });
    }

    map.on('load', addLayers);

    document.getElementById('togHeat').addEventListener('change', (e) => {
      heatmapOn = e.target.checked;
      if (!map.getLayer('stores-heatmap')) return;
      map.setLayoutProperty(
        'stores-heatmap',
        'visibility',
        heatmapOn ? 'visible' : 'none'
      );
    });
  </script>
</body>
</html>
