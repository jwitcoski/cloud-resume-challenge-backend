<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I2 — deck.gl Overlay</title>
  <script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"></script>
  <link href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css" rel="stylesheet" />
  <script src="https://unpkg.com/deck.gl@9.0.38/dist.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; }
    #map { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="/admin-boundaries/js/config.js"></script>
  <script>
    const key = window.MAPTILER_API_KEY;
    if (!key) {
      throw new Error('Missing MAPTILER_API_KEY — set it in /admin-boundaries/js/config.js');
    }
    maptilersdk.config.apiKey = key;

    // Demo points [lng, lat]
    const data = [];
    for (let i = 0; i < 400; i++) {
      data.push({
        position: [
          14.4178 + (Math.random() - 0.5) * 0.2,
          50.1167 + (Math.random() - 0.5) * 0.12,
        ],
        radius: 40 + Math.random() * 80,
      });
    }

    const map = new maptilersdk.Map({
      container: 'map',
      style: maptilersdk.MapStyle.DATAVIZ.DARK,
      center: [14.4178, 50.1167],
      zoom: 11,
      pitch: 40,
      navigationControl: true,
    });

    map.on('error', (e) => console.error('Map error', e && e.error));

    // Interleaved deck.gl overlay on MapTiler SDK basemap (not bare maplibre-gl alone)
    const { MapboxOverlay, ScatterplotLayer } = deck;

    const overlay = new MapboxOverlay({
      interleaved: true,
      layers: [
        new ScatterplotLayer({
          id: 'prague-scatter',
          data,
          getPosition: (d) => d.position,
          getRadius: (d) => d.radius,
          getFillColor: [255, 140, 0, 180],
          radiusUnits: 'meters',
          pickable: true,
        }),
      ],
    });

    map.on('load', () => {
      map.addControl(overlay);
    });
  </script>
</body>
</html>
