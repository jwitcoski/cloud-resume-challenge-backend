<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MapTiler v4 Style Switcher</title>
  <link rel="stylesheet" href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css">
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; }
    #controls { position: fixed; z-index: 2; left: 12px; top: 12px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 48px); padding: 8px; border-radius: 8px; background: #111827e8; }
    button { border: 1px solid #64748b; border-radius: 5px; padding: 7px 9px; background: white; cursor: pointer; }
    button[aria-pressed="true"] { background: #2563eb; color: white; }
    #status { flex-basis: 100%; color: white; font: 13px system-ui, sans-serif; }
    #status.error { color: #fecaca; }
  </style>
</head>
<body>
  <div id="map" role="application" aria-label="Map with selectable visual styles"></div>
  <nav id="controls" aria-label="Map style">
    <button type="button" data-style="streets" aria-pressed="true">Streets</button>
    <button type="button" data-style="hybrid" aria-pressed="false">Hybrid</button>
    <button type="button" data-style="outdoor" aria-pressed="false">Outdoor</button>
    <button type="button" data-style="dataviz" aria-pressed="false">DataViz Dark</button>
    <output id="status" aria-live="polite">Loading map…</output>
  </nav>
  <script src="../admin-boundaries/js/config.js"></script>
  <script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"></script>
  <script>
    (() => {
      "use strict";
      const status = document.getElementById("status");
      const buttons = [...document.querySelectorAll("button[data-style]")];
      const reportError = (message, error) => {
        status.textContent = message;
        status.className = "error";
        if (error) console.error(message, error);
      };
      const apiKey = typeof window.MAPTILER_API_KEY === "string"
        ? window.MAPTILER_API_KEY.trim()
        : "";
      if (!apiKey) {
        reportError("Missing window.MAPTILER_API_KEY in ../admin-boundaries/js/config.js.");
        buttons.forEach((button) => { button.disabled = true; });
        return;
      }
      if (!window.maptilersdk) {
        reportError("MapTiler SDK v4.0.2 failed to load.");
        buttons.forEach((button) => { button.disabled = true; });
        return;
      }
      maptilersdk.config.apiKey = apiKey;
      const styles = {
        streets: maptilersdk.MapStyle.STREETS,
        hybrid: maptilersdk.MapStyle.HYBRID,
        outdoor: maptilersdk.MapStyle.OUTDOOR,
        dataviz: maptilersdk.MapStyle.DATAVIZ.DARK
      };

      let map;
      try {
        map = new maptilersdk.Map({
          container: "map",
          style: styles.streets,
          center: [14.4178, 50.1167],
          zoom: 11,
          navigationControl: true
        });
      } catch (error) {
        reportError(`Map initialization failed: ${error.message || error}`, error);
        return;
      }

      function addCustomLayers() {
        if (!map.getSource("landmark")) {
          map.addSource("landmark", {
            type: "geojson",
            data: {
              type: "Feature",
              properties: { name: "Prague" },
              geometry: { type: "Point", coordinates: [14.4178, 50.1167] }
            }
          });
        }
        if (!map.getLayer("landmark-circle")) {
          const labelLayerId = map.getStyle().layers.find((layer) => layer.type === "symbol" && layer.layout && layer.layout["text-field"])?.id;
          map.addLayer({
            id: "landmark-circle",
            type: "circle",
            source: "landmark",
            paint: {
              "circle-radius": 9,
              "circle-color": "#f97316",
              "circle-stroke-color": "#ffffff",
              "circle-stroke-width": 2
            }
          }, labelLayerId);
        }
        status.textContent = "Style and custom landmark ready";
        status.className = "";
      }

      map.on("load", addCustomLayers);
      map.on("style.load", addCustomLayers);
      map.on("error", (event) => {
        const error = event && event.error ? event.error : new Error("Unknown map error");
        reportError(`Style or map data failed: ${error.message || error}`, error);
      });
      buttons.forEach((button) => {
        button.addEventListener("click", () => {
          const selected = button.dataset.style;
          status.textContent = `Loading ${button.textContent}…`;
          buttons.forEach((item) => item.setAttribute("aria-pressed", String(item === button)));
          map.setStyle(styles[selected]);
        });
      });
      window.addEventListener("beforeunload", () => map.remove(), { once: true });
    })();
  </script>
</body>
</html>
