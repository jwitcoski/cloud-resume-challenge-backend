<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MapTiler Globe Atmosphere</title>
  <link rel="stylesheet" href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css">
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; background: #020617; }
    #message { position: fixed; z-index: 2; left: 50%; top: 16px; transform: translateX(-50%); max-width: calc(100% - 48px); padding: 9px 13px; border-radius: 7px; background: #0f172ae8; color: #e2e8f0; font: 14px/1.4 system-ui, sans-serif; }
    #message.error { background: #7f1d1de8; }
  </style>
</head>
<body>
  <div id="map" role="application" aria-label="Interactive satellite globe"></div>
  <output id="message" aria-live="polite">Preparing atmospheric globe…</output>
  <script src="../admin-boundaries/js/config.js"></script>
  <script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"></script>
  <script>
    (() => {
      "use strict";
      const message = document.getElementById("message");
      const fail = (text, error) => {
        message.textContent = text;
        message.className = "error";
        if (error) console.error(text, error);
      };
      const apiKey = typeof window.MAPTILER_API_KEY === "string"
        ? window.MAPTILER_API_KEY.trim()
        : "";

      if (!apiKey) {
        fail("Missing MapTiler API key in ../admin-boundaries/js/config.js.");
        return;
      }
      if (!window.maptilersdk) {
        fail("MapTiler SDK v4.0.2 did not load.");
        return;
      }
      maptilersdk.config.apiKey = apiKey;

      let map;
      try {
        map = new maptilersdk.Map({
          container: "map",
          style: maptilersdk.MapStyle.SATELLITE,
          center: [10, 24],
          zoom: 1.5,
          projection: "globe",
          halo: true,
          space: true,
          projectionControl: true,
          navigationControl: true,
          cooperativeGestures: true
        });
      } catch (error) {
        fail(`Globe initialization failed: ${error.message || error}`, error);
        return;
      }

      map.on("load", () => {
        message.textContent = "Drag to orbit · scroll to zoom";
        window.setTimeout(() => { message.hidden = true; }, 3500);
      });
      map.on("error", (event) => {
        const error = event && event.error ? event.error : new Error("Unknown globe error");
        fail(`The globe could not load map data: ${error.message || error}`, error);
      });
      map.on("webglcontextlost", () => {
        fail("The WebGL context was lost. Reload the page or reduce GPU load.");
      });
      window.addEventListener("beforeunload", () => map.remove(), { once: true });
    })();
  </script>
</body>
</html>
