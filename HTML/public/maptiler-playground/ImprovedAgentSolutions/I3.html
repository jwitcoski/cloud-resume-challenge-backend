<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Runtime-configured MapTiler GeoSplat</title>
  <link rel="stylesheet" href="https://cdn.maptiler.com/maptiler-geosplats/v1.0.4/maptiler-geosplats.css">
  <script src="../admin-boundaries/js/config.js"></script>
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    #overlay { display: none; position: absolute; z-index: 10; inset: 1rem auto auto 50%; transform: translateX(-50%); width: min(38rem, calc(100% - 4rem)); padding: 1rem; border-radius: .65rem; color: white; background: rgba(127,29,29,.95); font: 15px/1.45 system-ui; box-shadow: 0 8px 30px #0006; }
    #hud { position: absolute; z-index: 5; bottom: 1rem; left: 1rem; padding: .7rem .9rem; color: white; background: rgba(15,23,42,.88); border-radius: .5rem; font: 14px system-ui; }
  </style>
</head>
<body>
  <div id="map" aria-label="Interactive WebGPU GeoSplat map"></div>
  <div id="overlay" role="alert"></div>
  <div id="hud" role="status">Checking WebGPU and runtime configuration…</div>

  <script type="module">
    import {
      Map,
      SplatModel,
      config,
      getVersion
    } from "https://cdn.maptiler.com/maptiler-geosplats/v1.0.4/maptiler-geosplats.mjs";

    const overlay = document.getElementById("overlay");
    const hud = document.getElementById("hud");
    const showFailure = (message, error) => {
      overlay.textContent = message;
      overlay.style.display = "block";
      hud.textContent = "GeoSplat unavailable";
      if (error) console.error(message, error);
    };

    if (!navigator.gpu) {
      showFailure(
        "WebGPU is not supported or is disabled. Open this page in a current WebGPU-enabled Chrome or Edge browser."
      );
    } else {
      const apiKey = window.MAPTILER_API_KEY;
      const modelId = window.MAPTILER_SPLAT_MODEL_ID;
      const validKey = typeof apiKey === "string" && apiKey.trim().length >= 8;
      const validModel = typeof modelId === "string" && modelId.trim().length >= 3;

      if (!validKey || !validModel) {
        showFailure(
          "Runtime configuration is incomplete. Provide an authorized MAPTILER_API_KEY and a real account MAPTILER_SPLAT_MODEL_ID in config.js."
        );
      } else {
        config.apiKey = apiKey.trim();
        const map = new Map({
          container: "map",
          apiKey: config.apiKey,
          center: [7.86040, 46.686488],
          zoom: 16,
          pitch: 58,
          bearing: 18,
          navigationControl: true
        });

        const model = new SplatModel({
          model: modelId.trim(),
          opacity: 1,
          visible: true
        });

        map.on("load", () => {
          try {
            map.addSplatModel(model);
            hud.textContent = `GeoSplats ${getVersion()} is loading the configured model…`;
          } catch (error) {
            showFailure(`Could not attach the GeoSplat model: ${error.message || error}`, error);
          }
        });

        map.on("splatmodelloaddone", () => {
          hud.textContent = `GeoSplats ${getVersion()} model ready. Drag to orbit and scroll to zoom.`;
        });
        map.on("splatmodelclick", () => {
          model.opacity = model.opacity > 0.7 ? 0.45 : 1;
          hud.textContent = `Model opacity: ${Math.round(model.opacity * 100)}%`;
        });
        map.on("splatmodelerror", ({ error }) => {
          showFailure(`The configured GeoSplat could not be loaded: ${error?.message || error}`, error);
        });
        map.on("error", ({ error }) => {
          showFailure(`Map, style, or authentication error: ${error?.message || error}`, error);
        });

        window.addEventListener("beforeunload", () => {
          map.removeSplatModel(model);
          map.remove();
        }, { once: true });
      }
    }
  </script>
</body>
</html>
