<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Animated Wind Weather</title>
  <link rel="stylesheet" href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css">
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; }
    #weather-panel { position: fixed; z-index: 2; left: 12px; top: 12px; min-width: 250px; max-width: calc(100% - 48px); padding: 10px; border-radius: 8px; background: #0f172ae8; color: white; font: 14px/1.45 system-ui, sans-serif; }
    #weather-panel button { margin: 7px 0; padding: 7px 10px; border: 0; border-radius: 5px; cursor: pointer; }
    #status.error { color: #fecaca; }
  </style>
</head>
<body>
  <div id="map" role="application" aria-label="Animated global wind forecast"></div>
  <section id="weather-panel">
    <strong>Wind forecast</strong>
    <div id="time">Waiting for forecast data…</div>
    <button id="play" type="button" disabled>Play forecast</button>
    <div id="wind">Move over the map to inspect wind speed.</div>
    <output id="status" aria-live="polite"></output>
  </section>
  <script src="../admin-boundaries/js/config.js"></script>
  <script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"></script>
  <script src="https://cdn.maptiler.com/maptiler-weather/3.1.1/maptiler-weather.umd.min.js"></script>
  <script>
    (() => {
      "use strict";
      const time = document.getElementById("time");
      const wind = document.getElementById("wind");
      const status = document.getElementById("status");
      const play = document.getElementById("play");
      const reportError = (message, error) => {
        status.textContent = message;
        status.className = "error";
        if (error) console.error(message, error);
      };
      const apiKey = typeof window.MAPTILER_API_KEY === "string"
        ? window.MAPTILER_API_KEY.trim()
        : "";
      if (!apiKey) {
        reportError("Missing window.MAPTILER_API_KEY in ../admin-boundaries/js/config.js.");
        return;
      }
      if (!window.maptilersdk || !window.maptilerweather) {
        reportError("MapTiler SDK or Weather v3.1.1 failed to load.");
        return;
      }
      maptilersdk.config.apiKey = apiKey;

      let map;
      let weatherLayer;
      let playing = false;
      try {
        map = new maptilersdk.Map({
          container: "map",
          style: maptilersdk.MapStyle.BACKDROP.DARK,
          center: [5, 35],
          zoom: 2.3,
          navigationControl: true
        });
        weatherLayer = new maptilerweather.WindLayer({ id: "wind-forecast" });
      } catch (error) {
        reportError(`Weather map initialization failed: ${error.message || error}`, error);
        return;
      }

      function addWeather() {
        try {
          if (!map.getLayer("wind-forecast")) map.addLayer(weatherLayer);
        } catch (error) {
          reportError(`Wind layer could not be added: ${error.message || error}`, error);
        }
      }
      map.on("load", addWeather);
      map.on("style.load", addWeather);
      weatherLayer.on("sourceReady", () => {
        play.disabled = false;
        status.textContent = "Forecast loaded";
        time.textContent = weatherLayer.getAnimationTimeDate().toLocaleString();
      });
      weatherLayer.on("tick", () => {
        time.textContent = weatherLayer.getAnimationTimeDate().toLocaleString();
      });
      play.addEventListener("click", () => {
        playing = !playing;
        weatherLayer.animateByFactor(playing ? 3600 : 0);
        play.textContent = playing ? "Pause forecast" : "Play forecast";
      });
      map.on("mousemove", ({ lngLat }) => {
        try {
          const sample = weatherLayer.pickAt(lngLat.lng, lngLat.lat);
          wind.textContent = sample
            ? `Wind: ${sample.speedMetersPerSecond.toFixed(1)} m/s`
            : "No wind sample at this location yet.";
        } catch (error) {
          reportError(`Wind inspection failed: ${error.message || error}`, error);
        }
      });
      map.on("error", ({ error }) => reportError(`Map or weather data failed: ${error?.message || error || "Unknown error"}`, error));
      window.addEventListener("beforeunload", () => map.remove(), { once: true });
    })();
  </script>
</body>
</html>
