<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>X3 — Store Locator: 5,000 stores with clusters + heatmap</title>
  <script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"></script>
  <link href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css" rel="stylesheet" />
  <script src="../admin-boundaries/js/config.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #map { position: absolute; inset: 0; height: 100%; }
    #error-bar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 20;
      background: #b00020; color: #fff; padding: 10px 14px;
      font: 14px/1.4 system-ui, sans-serif;
    }
    #panel {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      background: rgba(16, 20, 28, 0.88); color: #eef2f7;
      border-radius: 10px; padding: 12px 14px; width: 270px;
      font: 13px/1.5 system-ui, sans-serif;
    }
    #panel h1 { margin: 0 0 8px; font-size: 15px; }
    #panel button {
      width: 100%; margin-top: 8px; background: #2b6cb0; color: #fff;
      border: 0; border-radius: 6px; padding: 7px 10px; cursor: pointer; font-size: 13px;
    }
    #view-label { color: #9fd3ff; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="error-bar" hidden></div>
  <div id="panel">
    <h1>Store locator — 5,000 stores</h1>
    <div>View: <span id="view-label">clusters</span>. Click a cluster to expand,
      click a store for details.</div>
    <button id="toggle-heatmap" type="button">Switch to heatmap</button>
  </div>
  <script>
    "use strict";

    const errorBar = document.getElementById("error-bar");
    function showError(message, error) {
      errorBar.textContent = message;
      errorBar.hidden = false;
      if (error) console.error(message, error);
    }

    const apiKey = window.MAPTILER_API_KEY;
    if (!apiKey || /YOUR_MAPTILER/i.test(apiKey)) {
      showError("Missing MapTiler API key: define window.MAPTILER_API_KEY in ../admin-boundaries/js/config.js before loading this page.");
      throw new Error("Missing MAPTILER_API_KEY");
    }
    maptilersdk.config.apiKey = apiKey;

    // Deterministic PRNG so the demo dataset is stable across reloads.
    function mulberry32(seed) {
      return function () {
        seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    // Metro hubs as [lng, lat] — MapTiler/GeoJSON order.
    const METROS = [
      { name: "New York", center: [-74.0060, 40.7128] },
      { name: "Los Angeles", center: [-118.2437, 34.0522] },
      { name: "Chicago", center: [-87.6298, 41.8781] },
      { name: "Houston", center: [-95.3698, 29.7604] },
      { name: "Phoenix", center: [-112.0740, 33.4484] },
      { name: "Seattle", center: [-122.3321, 47.6062] },
      { name: "Denver", center: [-104.9903, 39.7392] },
      { name: "Atlanta", center: [-84.3880, 33.7490] },
      { name: "Miami", center: [-80.1918, 25.7617] },
      { name: "Minneapolis", center: [-93.2650, 44.9778] },
      { name: "Boston", center: [-71.0589, 42.3601] },
      { name: "Dallas", center: [-96.7970, 32.7767] },
    ];

    function buildStores() {
      const rand = mulberry32(20260720);
      const features = [];
      for (let i = 0; i < 5000; i++) {
        const metro = METROS[Math.floor(rand() * METROS.length)];
        // Box-Muller scatter (~0.35°) keeps stores dense downtown, sparse outside.
        const r = Math.sqrt(-2 * Math.log(1 - rand())) * 0.35;
        const theta = rand() * Math.PI * 2;
        const lng = metro.center[0] + r * Math.cos(theta);
        const lat = metro.center[1] + r * Math.sin(theta) * 0.75;
        features.push({
          type: "Feature",
          geometry: { type: "Point", coordinates: [lng, lat] },
          properties: {
            id: i,
            name: "Store #" + String(i + 1).padStart(4, "0"),
            city: metro.name,
            rating: Math.round((3 + rand() * 2) * 10) / 10,
          },
        });
      }
      return { type: "FeatureCollection", features };
    }

    const stores = buildStores();

    const map = new maptilersdk.Map({
      container: "map",
      style: maptilersdk.MapStyle.DATAVIZ.DARK,
      center: [-96.5, 38.5],
      zoom: 3.6,
      navigationControl: true,
    });

    map.on("error", ({ error }) => {
      showError("Map error: " + (error && error.message ? error.message : "style, tile or WebGL failure — see console."), error);
    });

    let clusterIds = null;
    let heatmapIds = null;
    let heatmapOn = false;

    map.on("load", async () => {
      try {
        clusterIds = await maptilersdk.helpers.addPoint(map, {
          data: stores,
          sourceId: "stores",
          cluster: true,
          showLabel: true,
          labelColor: "#ffffff",
        });

        heatmapIds = await maptilersdk.helpers.addHeatmap(map, {
          data: stores,
          sourceId: "stores-heat-source",
          layerId: "stores-heatmap",
          radius: 24,
          opacity: 0.8,
        });
        map.setLayoutProperty(heatmapIds.heatmapLayerId, "visibility", "none");

        // Ring around clustered bubbles (uses the helper's clustered source).
        map.addLayer({
          id: "cluster-ring",
          type: "circle",
          source: clusterIds.pointSourceId,
          filter: ["has", "point_count"],
          paint: {
            "circle-radius": 26,
            "circle-color": "rgba(0,0,0,0)",
            "circle-stroke-color": "#63b3ed",
            "circle-stroke-width": 1.5,
            "circle-stroke-opacity": 0.6,
          },
        }, clusterIds.clusterLayerId);

        // Highlight for the currently selected unclustered store.
        map.addLayer({
          id: "store-highlight",
          type: "circle",
          source: clusterIds.pointSourceId,
          filter: ["all", ["!", ["has", "point_count"]], ["==", ["get", "id"], -1]],
          paint: {
            "circle-radius": 14,
            "circle-color": "rgba(0,0,0,0)",
            "circle-stroke-color": "#f6e05e",
            "circle-stroke-width": 3,
          },
        });

        wireInteractions();
      } catch (error) {
        showError("Failed to build the store layers (helpers.addPoint / helpers.addHeatmap).", error);
      }
    });

    function wireInteractions() {
      map.on("click", clusterIds.clusterLayerId, async (e) => {
        const cluster = e.features && e.features[0];
        if (!cluster) return;
        const source = map.getSource(clusterIds.pointSourceId);
        try {
          const zoom = await source.getClusterExpansionZoom(cluster.properties.cluster_id);
          map.easeTo({ center: cluster.geometry.coordinates, zoom: zoom + 0.3 });
        } catch (error) {
          console.error("Cluster expansion lookup failed, using fixed zoom step.", error);
          map.easeTo({ center: cluster.geometry.coordinates, zoom: map.getZoom() + 2 });
        }
      });

      map.on("click", clusterIds.pointLayerId, (e) => {
        const feature = e.features && e.features[0];
        if (!feature || feature.properties.point_count) return;
        const props = feature.properties;
        map.setFilter("store-highlight",
          ["all", ["!", ["has", "point_count"]], ["==", ["get", "id"], props.id]]);
        new maptilersdk.Popup()
          .setLngLat(feature.geometry.coordinates)
          .setHTML(
            "<strong>" + props.name + "</strong><br/>" +
            props.city + " metro<br/>Rating: " + props.rating + " / 5"
          )
          .addTo(map);
      });

      for (const layerId of [clusterIds.clusterLayerId, clusterIds.pointLayerId]) {
        map.on("mouseenter", layerId, () => { map.getCanvas().style.cursor = "pointer"; });
        map.on("mouseleave", layerId, () => { map.getCanvas().style.cursor = ""; });
      }
    }

    const viewLabel = document.getElementById("view-label");
    document.getElementById("toggle-heatmap").addEventListener("click", (e) => {
      if (!clusterIds || !heatmapIds) return;
      heatmapOn = !heatmapOn;
      const clusterVisibility = heatmapOn ? "none" : "visible";
      const pointLayers = [
        clusterIds.clusterLayerId, clusterIds.pointLayerId, clusterIds.labelLayerId,
        "cluster-ring", "store-highlight",
      ];
      for (const layerId of pointLayers) {
        if (layerId && map.getLayer(layerId)) {
          map.setLayoutProperty(layerId, "visibility", clusterVisibility);
        }
      }
      map.setLayoutProperty(heatmapIds.heatmapLayerId, "visibility", heatmapOn ? "visible" : "none");
      viewLabel.textContent = heatmapOn ? "heatmap" : "clusters";
      e.target.textContent = heatmapOn ? "Switch to clusters" : "Switch to heatmap";
    });
  </script>
</body>
</html>
