<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hello Map — Prague</title>
  <link rel="stylesheet" href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css">
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; }
    #status { position: fixed; z-index: 2; left: 12px; top: 12px; max-width: min(420px, calc(100% - 48px)); padding: 9px 12px; border-radius: 6px; background: #152238e8; color: white; font: 14px/1.4 system-ui, sans-serif; }
    #status[data-state="ready"] { background: #14532de8; }
    #status[data-state="error"] { background: #7f1d1de8; }
  </style>
</head>
<body>
  <div id="map" role="application" aria-label="Interactive street map centered on Prague"></div>
  <output id="status" aria-live="polite">Starting Prague map…</output>
  <script src="../admin-boundaries/js/config.js"></script>
  <script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"></script>
  <script>
    (() => {
      "use strict";
      const status = document.getElementById("status");
      const showStatus = (message, state = "loading") => {
        status.textContent = message;
        status.dataset.state = state;
      };
      const apiKey = typeof window.MAPTILER_API_KEY === "string"
        ? window.MAPTILER_API_KEY.trim()
        : "";

      if (!apiKey) {
        showStatus("Missing MapTiler API key. Define window.MAPTILER_API_KEY in ../admin-boundaries/js/config.js.", "error");
        return;
      }
      if (!window.maptilersdk) {
        showStatus("MapTiler SDK failed to load. Check the network connection and content security policy.", "error");
        return;
      }

      maptilersdk.config.apiKey = apiKey;
      let map;
      try {
        map = new maptilersdk.Map({
          container: "map",
          style: maptilersdk.MapStyle.STREETS,
          center: [14.4178, 50.1167],
          zoom: 12,
          navigationControl: true,
          scaleControl: true
        });
      } catch (error) {
        console.error("Map initialization failed:", error);
        showStatus(`Unable to initialize the map: ${error.message || error}`, "error");
        return;
      }

      map.on("load", () => {
        showStatus("Prague streets map ready", "ready");
        window.setTimeout(() => {
          if (status.dataset.state === "ready") status.hidden = true;
        }, 2500);
      });
      map.on("error", (event) => {
        const error = event && event.error ? event.error : new Error("Unknown map rendering error");
        console.error("MapTiler map error:", error);
        showStatus(`Map data could not be displayed: ${error.message || error}`, "error");
      });
      window.addEventListener("beforeunload", () => map.remove(), { once: true });
    })();
  </script>
</body>
</html>
