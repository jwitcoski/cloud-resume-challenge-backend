<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Static Map Snapshot</title>
  <link rel="stylesheet" href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css">
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; }
    #panel { position: fixed; z-index: 2; right: 12px; top: 12px; width: min(360px, calc(100% - 48px)); padding: 10px; border-radius: 8px; background: #0f172ae8; color: white; font: 14px system-ui, sans-serif; }
    #snapshot { display: none; width: 100%; margin-top: 9px; border-radius: 5px; background: #e2e8f0; }
    button { padding: 8px 10px; border: 0; border-radius: 5px; cursor: pointer; }
    #status { display: block; margin-top: 7px; }
    #status.error { color: #fecaca; }
  </style>
</head>
<body>
  <div id="map" role="application" aria-label="Interactive map used to choose a static snapshot"></div>
  <section id="panel">
    <button id="capture" type="button" disabled>Generate snapshot</button>
    <output id="status" aria-live="polite">Loading interactive map…</output>
    <img id="snapshot" alt="Static map snapshot of the selected viewport">
  </section>
  <script src="../admin-boundaries/js/config.js"></script>
  <script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"></script>
  <script>
    (() => {
      "use strict";
      const capture = document.getElementById("capture");
      const status = document.getElementById("status");
      const snapshot = document.getElementById("snapshot");
      const showError = (message, error) => {
        status.textContent = message;
        status.className = "error";
        if (error) console.error(message, error);
      };
      const apiKey = typeof window.MAPTILER_API_KEY === "string"
        ? window.MAPTILER_API_KEY.trim()
        : "";
      if (!apiKey) {
        showError("Missing window.MAPTILER_API_KEY in ../admin-boundaries/js/config.js.");
        return;
      }
      if (!window.maptilersdk) {
        showError("MapTiler SDK v4.0.2 failed to load.");
        return;
      }
      maptilersdk.config.apiKey = apiKey;

      let map;
      try {
        map = new maptilersdk.Map({
          container: "map",
          style: maptilersdk.MapStyle.STREETS,
          center: [14.4178, 50.1167],
          zoom: 12,
          navigationControl: true
        });
      } catch (error) {
        showError(`Map initialization failed: ${error.message || error}`, error);
        return;
      }

      async function generateSnapshot() {
        capture.disabled = true;
        status.className = "";
        status.textContent = "Rendering static image…";
        snapshot.style.display = "none";
        try {
          const center = map.getCenter();
          const zoom = Math.max(0, Math.min(22, Math.round(map.getZoom() * 10) / 10));
          const url = maptilersdk.staticMaps.centered(
            [center.lng, center.lat],
            zoom,
            {
              style: maptilersdk.MapStyle.STREETS,
              width: 640,
              height: 360,
              hiDPI: window.devicePixelRatio > 1,
              markers: [[center.lng, center.lat, "red"]]
            }
          );
          snapshot.src = url;
          await snapshot.decode();
          snapshot.style.display = "block";
          status.textContent = `Snapshot centered at ${center.lat.toFixed(4)}, ${center.lng.toFixed(4)} (zoom ${zoom})`;
        } catch (error) {
          snapshot.removeAttribute("src");
          showError(`Static map generation failed: ${error.message || error}`, error);
        } finally {
          capture.disabled = false;
        }
      }
      capture.addEventListener("click", generateSnapshot);
      snapshot.addEventListener("error", () => showError("The static image request failed. Check API-key restrictions and network access."));
      map.on("load", () => {
        capture.disabled = false;
        status.textContent = "Pan or zoom, then generate a static snapshot.";
      });
      map.on("error", ({ error }) => showError(`Interactive map data failed: ${error?.message || error || "Unknown error"}`, error));
      window.addEventListener("beforeunload", () => map.remove(), { once: true });
    })();
  </script>
</body>
</html>
