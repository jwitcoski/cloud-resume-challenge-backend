<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>X1 — Stacked World: Globe + Terrain + Wind</title>
  <script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"></script>
  <link href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css" rel="stylesheet" />
  <script src="https://cdn.maptiler.com/maptiler-weather/3.1.1/maptiler-weather.umd.min.js"></script>
  <script src="../admin-boundaries/js/config.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #map { position: absolute; inset: 0; height: 100%; }
    #error-bar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 20;
      background: #b00020; color: #fff; padding: 10px 14px;
      font: 14px/1.4 system-ui, sans-serif;
    }
    #panel {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      background: rgba(16, 20, 28, 0.88); color: #eef2f7;
      border-radius: 10px; padding: 12px 14px; width: 300px;
      font: 13px/1.5 system-ui, sans-serif;
    }
    #panel h1 { margin: 0 0 8px; font-size: 15px; }
    #panel .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
    #panel button {
      background: #2b6cb0; color: #fff; border: 0; border-radius: 6px;
      padding: 6px 10px; cursor: pointer; font-size: 13px;
    }
    #panel button:hover { background: #2c5282; }
    #time-slider { flex: 1; }
    #time-text, #wind-readout { color: #9fd3ff; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="error-bar" hidden></div>
  <div id="panel">
    <h1>Stacked World — wind over 3D globe</h1>
    <div>Time: <span id="time-text">loading forecast…</span></div>
    <div>Wind at cursor: <span id="wind-readout">move over the globe</span></div>
    <div class="row">
      <button id="play-pause" type="button">Play 3600×</button>
      <input id="time-slider" type="range" min="0" max="100" value="0" step="1" />
    </div>
    <div class="row">
      <button id="fly-alps" type="button">Fly to the Alps</button>
      <button id="style-toggle" type="button">Switch to Backdrop</button>
    </div>
  </div>
  <script>
    "use strict";

    const errorBar = document.getElementById("error-bar");
    function showError(message, error) {
      errorBar.textContent = message;
      errorBar.hidden = false;
      if (error) console.error(message, error);
    }

    const apiKey = window.MAPTILER_API_KEY;
    if (!apiKey || /YOUR_MAPTILER/i.test(apiKey)) {
      showError("Missing MapTiler API key: define window.MAPTILER_API_KEY in ../admin-boundaries/js/config.js before loading this page.");
      throw new Error("Missing MAPTILER_API_KEY");
    }
    maptilersdk.config.apiKey = apiKey;

    const map = new maptilersdk.Map({
      container: "map",
      style: maptilersdk.MapStyle.SATELLITE,
      projection: "globe",
      halo: true,
      space: true,
      terrain: true,
      terrainExaggeration: 1.4,
      center: [8.2, 46.8],
      zoom: 1.6,
      navigationControl: true,
      terrainControl: true,
    });

    map.on("error", ({ error }) => {
      showError("Map error: " + (error && error.message ? error.message : "style, tile or WebGL failure — see console."), error);
    });

    const timeText = document.getElementById("time-text");
    const timeSlider = document.getElementById("time-slider");
    const playPauseBtn = document.getElementById("play-pause");
    const windReadout = document.getElementById("wind-readout");
    const styleToggleBtn = document.getElementById("style-toggle");

    let windLayer = null;
    let isPlaying = false;
    let pointerLngLat = null;

    function refreshTimeDisplay() {
      if (!windLayer) return;
      const d = windLayer.getAnimationTimeDate();
      if (d) {
        timeText.textContent = d.toUTCString();
        timeSlider.value = +d;
      }
    }

    function updateWindReadout(lngLat) {
      if (!windLayer || !lngLat) return;
      pointerLngLat = lngLat;
      const value = windLayer.pickAt(lngLat.lng, lngLat.lat);
      windReadout.textContent = value
        ? value.speedMetersPerSecond.toFixed(1) + " m/s"
        : "no data here";
    }

    // setStyle() drops custom layers, so the wind layer is rebuilt from scratch
    // on every style.load (which also fires for the initial style).
    function attachWindLayer() {
      try {
        if (map.getLayer("wind-flow")) return;
        windLayer = new maptilerweather.WindLayer({ id: "wind-flow" });

        windLayer.on("sourceReady", () => {
          const startDate = windLayer.getAnimationStartDate();
          const endDate = windLayer.getAnimationEndDate();
          if (startDate && endDate) {
            timeSlider.min = +startDate;
            timeSlider.max = +endDate;
          }
          refreshTimeDisplay();
          if (isPlaying) windLayer.animateByFactor(3600);
        });
        windLayer.on("tick", () => {
          refreshTimeDisplay();
          updateWindReadout(pointerLngLat);
        });
        windLayer.on("animationTimeSet", refreshTimeDisplay);

        map.addLayer(windLayer);
      } catch (error) {
        showError("Could not attach the MapTiler weather wind layer (Cloud request may have failed).", error);
      }
    }

    map.on("style.load", () => {
      map.enableTerrain(1.4);
      attachWindLayer();
    });

    map.on("load", () => {
      map.flyTo({ center: [8.6520, 46.5697], zoom: 7.5, pitch: 55, duration: 6000 });
    });

    timeSlider.addEventListener("input", () => {
      if (windLayer) windLayer.setAnimationTime(parseInt(timeSlider.value, 10) / 1000);
    });

    playPauseBtn.addEventListener("click", () => {
      if (!windLayer) return;
      if (isPlaying) {
        windLayer.animateByFactor(0);
        playPauseBtn.textContent = "Play 3600×";
      } else {
        windLayer.animateByFactor(3600);
        playPauseBtn.textContent = "Pause";
      }
      isPlaying = !isPlaying;
    });

    document.getElementById("fly-alps").addEventListener("click", () => {
      map.flyTo({ center: [8.6520, 46.5697], zoom: 8.5, pitch: 60, bearing: 20, duration: 5000 });
    });

    let onSatellite = true;
    styleToggleBtn.addEventListener("click", () => {
      onSatellite = !onSatellite;
      // Wind + terrain are restored by the style.load handler above.
      map.setStyle(onSatellite ? maptilersdk.MapStyle.SATELLITE : maptilersdk.MapStyle.BACKDROP.DARK);
      styleToggleBtn.textContent = onSatellite ? "Switch to Backdrop" : "Switch to Satellite";
    });

    map.on("mousemove", (e) => updateWindReadout(e.lngLat));
    map.on("mouseout", () => {
      windReadout.textContent = "move over the globe";
      pointerLngLat = null;
    });
  </script>
</body>
</html>
