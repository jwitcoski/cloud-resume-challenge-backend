<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Geocode Roundtrip</title>
  <link rel="stylesheet" href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css">
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; }
    #search { position: fixed; z-index: 2; left: 12px; top: 12px; display: grid; grid-template-columns: minmax(150px, 280px) auto; gap: 7px; max-width: calc(100% - 48px); padding: 10px; border-radius: 8px; background: #0f172ae8; color: white; font: 14px system-ui, sans-serif; }
    input, button { padding: 8px; border: 0; border-radius: 5px; }
    #result { grid-column: 1 / -1; }
    #result.error { color: #fecaca; }
  </style>
</head>
<body>
  <div id="map" role="application" aria-label="Searchable map with reverse geocoding"></div>
  <form id="search">
    <input id="q" name="q" value="Prague Castle" aria-label="Place to find" autocomplete="off" required>
    <button type="submit">Find</button>
    <output id="result" aria-live="polite">Search for a place or click the map.</output>
  </form>
  <script src="../admin-boundaries/js/config.js"></script>
  <script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"></script>
  <script>
    (() => {
      "use strict";
      const form = document.getElementById("search");
      const queryInput = document.getElementById("q");
      const result = document.getElementById("result");
      const showError = (message, error) => {
        result.textContent = message;
        result.className = "error";
        if (error) console.error(message, error);
      };
      const apiKey = typeof window.MAPTILER_API_KEY === "string"
        ? window.MAPTILER_API_KEY.trim()
        : "";
      if (!apiKey) {
        showError("Missing window.MAPTILER_API_KEY in ../admin-boundaries/js/config.js.");
        return;
      }
      if (!window.maptilersdk) {
        showError("MapTiler SDK v4.0.2 failed to load.");
        return;
      }
      maptilersdk.config.apiKey = apiKey;

      let map;
      let marker;
      try {
        map = new maptilersdk.Map({
          container: "map",
          style: maptilersdk.MapStyle.STREETS,
          center: [14.4178, 50.1167],
          zoom: 11,
          navigationControl: true
        });
        marker = new maptilersdk.Marker({ color: "#dc2626" });
      } catch (error) {
        showError(`Map initialization failed: ${error.message || error}`, error);
        return;
      }

      const featureLabel = (feature) => feature.place_name || feature.text || "Unnamed result";
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const query = queryInput.value.trim();
        if (!query) return;
        result.className = "";
        result.textContent = `Searching for ${query}…`;
        try {
          const response = await maptilersdk.geocoding.forward(query, { limit: 1 });
          const feature = response.features && response.features[0];
          const coordinates = feature && feature.geometry && feature.geometry.coordinates;
          if (!coordinates || coordinates.length < 2) throw new Error("No matching location was found");
          marker.setLngLat([coordinates[0], coordinates[1]]).addTo(map);
          map.flyTo({ center: [coordinates[0], coordinates[1]], zoom: 15, essential: true });
          result.textContent = `Found: ${featureLabel(feature)}`;
        } catch (error) {
          showError(`Forward geocoding failed: ${error.message || error}`, error);
        }
      });

      map.on("click", async ({ lngLat }) => {
        result.className = "";
        result.textContent = "Looking up this location…";
        try {
          const coordinates = [lngLat.lng, lngLat.lat];
          const response = await maptilersdk.geocoding.reverse(coordinates, { limit: 1 });
          const feature = response.features && response.features[0];
          if (!feature) throw new Error("No address or place was found here");
          marker.setLngLat(coordinates).addTo(map);
          result.textContent = `Clicked: ${featureLabel(feature)}`;
        } catch (error) {
          showError(`Reverse geocoding failed: ${error.message || error}`, error);
        }
      });
      map.on("error", ({ error }) => showError(`Map data failed: ${error?.message || error || "Unknown error"}`, error));
      window.addEventListener("beforeunload", () => map.remove(), { once: true });
    })();
  </script>
</body>
</html>
