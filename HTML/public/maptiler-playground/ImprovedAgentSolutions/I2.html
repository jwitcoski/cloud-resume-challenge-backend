<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>deck.gl interleaved MapTiler overlay</title>
  <link rel="stylesheet" href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css">
  <script src="../admin-boundaries/js/config.js"></script>
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; }
    #panel { position: absolute; z-index: 3; top: 12px; left: 12px; width: min(22rem, calc(100% - 48px)); padding: .8rem; border-radius: .6rem; color: #f8fafc; background: rgba(15,23,42,.9); font: 14px/1.35 system-ui; }
    #panel output { display: block; margin-top: .5rem; color: #bfdbfe; }
    #panel[data-error="true"] { background: rgba(127,29,29,.94); }
  </style>
</head>
<body>
  <div id="map" aria-label="MapTiler map with deck.gl earthquake overlay"></div>
  <aside id="panel">
    <strong>Recent-event visualization</strong>
    <div>Hover a deck.gl point to inspect its magnitude.</div>
    <output id="detail">Loading overlay…</output>
  </aside>

  <script type="module">
    import * as maptilersdk from "https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.mjs";
    import { MapboxOverlay } from "https://cdn.jsdelivr.net/npm/@deck.gl/mapbox@9.1.14/+esm";
    import { ScatterplotLayer } from "https://cdn.jsdelivr.net/npm/@deck.gl/layers@9.1.14/+esm";

    const panel = document.getElementById("panel");
    const detail = document.getElementById("detail");
    const fail = (message, error) => {
      panel.dataset.error = "true";
      detail.textContent = message;
      if (error) console.error(message, error);
    };

    const apiKey = window.MAPTILER_API_KEY;
    if (typeof apiKey !== "string" || apiKey.trim().length < 8) {
      fail("Missing MAPTILER_API_KEY in ../admin-boundaries/js/config.js.");
      throw new Error("Missing MAPTILER_API_KEY");
    }
    maptilersdk.config.apiKey = apiKey.trim();

    const events = [
      { name: "San Francisco", position: [-122.4194, 37.7749], magnitude: 4.2 },
      { name: "Los Angeles", position: [-118.2437, 34.0522], magnitude: 3.7 },
      { name: "Seattle", position: [-122.3321, 47.6062], magnitude: 2.9 },
      { name: "Salt Lake City", position: [-111.8910, 40.7608], magnitude: 3.3 },
      { name: "Las Vegas", position: [-115.1398, 36.1699], magnitude: 2.6 },
      { name: "Portland", position: [-122.6765, 45.5231], magnitude: 3.1 }
    ];

    const map = new maptilersdk.Map({
      container: "map",
      style: maptilersdk.MapStyle.DATAVIZ.DARK,
      center: [-119.5, 39.5],
      zoom: 4.1,
      navigationControl: true,
      cooperativeGestures: true
    });

    const makeLayer = () => new ScatterplotLayer({
      id: "event-points",
      data: events,
      pickable: true,
      filled: true,
      stroked: true,
      radiusUnits: "meters",
      getPosition: event => event.position,
      getRadius: event => 14000 * event.magnitude,
      getFillColor: event => event.magnitude >= 4 ? [239, 68, 68, 190] : [59, 130, 246, 190],
      getLineColor: [255, 255, 255, 220],
      lineWidthMinPixels: 2,
      onHover: ({ object }) => {
        detail.textContent = object
          ? `${object.name}: magnitude ${object.magnitude}`
          : `${events.length} events rendered in the shared WebGL context.`;
      },
      onClick: ({ object }) => {
        if (object) map.flyTo({ center: object.position, zoom: 7, duration: 900 });
      }
    });

    const overlay = new MapboxOverlay({
      interleaved: true,
      layers: [makeLayer()]
    });

    map.on("load", () => {
      map.addControl(overlay);
      detail.textContent = `${events.length} events rendered in the shared WebGL context.`;
    });
    map.on("error", ({ error }) => fail(`Map or tile error: ${error?.message || error}`, error));

    window.addEventListener("beforeunload", () => {
      overlay.finalize();
      map.remove();
    }, { once: true });
  </script>
</body>
</html>
