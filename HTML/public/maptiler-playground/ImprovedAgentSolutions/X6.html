<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>X6 — Schema Honest Outdoor: contours, trails and peaks</title>
  <script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"></script>
  <link href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css" rel="stylesheet" />
  <script src="../admin-boundaries/js/config.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #map { position: absolute; inset: 0; height: 100%; }
    #error-bar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 20;
      background: #b00020; color: #fff; padding: 10px 14px;
      font: 14px/1.4 system-ui, sans-serif;
    }
    #panel {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      background: rgba(16, 20, 28, 0.9); color: #eef2f7;
      border-radius: 10px; padding: 12px 14px; width: 300px;
      font: 13px/1.5 system-ui, sans-serif;
    }
    #panel h1 { margin: 0 0 8px; font-size: 15px; }
    #panel label { display: flex; gap: 8px; align-items: center; margin-top: 6px; cursor: pointer; }
    .hint { color: #a0aec0; font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="error-bar" hidden></div>
  <div id="panel">
    <h1>Zermatt outdoor overlays</h1>
    <label><input id="tog-contours" type="checkbox" checked /> Contour lines + labels (<code>contour</code>)</label>
    <label><input id="tog-trails" type="checkbox" checked /> Hiking paths &amp; tracks (<code>transportation</code>)</label>
    <label><input id="tog-peaks" type="checkbox" checked /> Mountain peaks (<code>mountain_peak</code>)</label>
    <div class="hint">All source-layer names come straight from the MapTiler
      Contours and OpenMapTiles schemas. Click a peak for its elevation.</div>
  </div>
  <script>
    "use strict";

    const errorBar = document.getElementById("error-bar");
    function showError(message, error) {
      errorBar.textContent = message;
      errorBar.hidden = false;
      if (error) console.error(message, error);
    }

    const apiKey = window.MAPTILER_API_KEY;
    if (!apiKey || /YOUR_MAPTILER/i.test(apiKey)) {
      showError("Missing MapTiler API key: define window.MAPTILER_API_KEY in ../admin-boundaries/js/config.js before loading this page.");
      throw new Error("Missing MAPTILER_API_KEY");
    }
    maptilersdk.config.apiKey = apiKey;

    // Direct Cloud tile URLs need the key appended explicitly — config.apiKey
    // only covers SDK-managed requests.
    const CONTOURS_TILES_URL =
      "https://api.maptiler.com/tiles/contours-v2/tiles.json?key=" + encodeURIComponent(apiKey);
    const PLANET_TILES_URL =
      "https://api.maptiler.com/tiles/v3/tiles.json?key=" + encodeURIComponent(apiKey);

    const map = new maptilersdk.Map({
      container: "map",
      style: maptilersdk.MapStyle.OUTDOOR,
      center: [7.7491, 46.0207],
      zoom: 12.5,
      navigationControl: true,
      terrainControl: true,
    });

    map.on("error", ({ error }) => {
      showError("Map error: " + (error && error.message ? error.message : "style, tile or WebGL failure — see console."), error);
    });

    async function verifyTileset(url, label) {
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(label + " TileJSON returned HTTP " + response.status +
          (response.status === 403 ? " — check key restrictions in the Cloud console" : ""));
      }
    }

    map.on("load", async () => {
      try {
        // Surface Cloud auth/availability problems up front instead of
        // letting tiles fail silently in the background.
        await Promise.all([
          verifyTileset(CONTOURS_TILES_URL, "Contours"),
          verifyTileset(PLANET_TILES_URL, "OpenMapTiles planet"),
        ]);

        map.addSource("contours", { type: "vector", url: CONTOURS_TILES_URL });
        map.addSource("planet", { type: "vector", url: PLANET_TILES_URL });

        // Contours schema: layer `contour`, fields `height` (m) and `nth_line`.
        map.addLayer({
          id: "contour-minor",
          type: "line",
          source: "contours",
          "source-layer": "contour",
          filter: ["<", ["get", "nth_line"], 5],
          paint: { "line-color": "#8b5a2b", "line-opacity": 0.35, "line-width": 0.7 },
        });
        map.addLayer({
          id: "contour-index",
          type: "line",
          source: "contours",
          "source-layer": "contour",
          filter: [">=", ["get", "nth_line"], 5],
          paint: { "line-color": "#8b5a2b", "line-opacity": 0.6, "line-width": 1.6 },
        });
        map.addLayer({
          id: "contour-labels",
          type: "symbol",
          source: "contours",
          "source-layer": "contour",
          filter: [">=", ["get", "nth_line"], 5],
          layout: {
            "symbol-placement": "line",
            "text-field": ["concat", ["to-string", ["get", "height"]], " m"],
            "text-size": 10,
            "text-font": ["Noto Sans Regular"],
          },
          paint: { "text-color": "#6b4423", "text-halo-color": "#ffffff", "text-halo-width": 1 },
        });

        // OpenMapTiles schema: `transportation` carries paths/tracks via `class`.
        map.addLayer({
          id: "hiking-paths",
          type: "line",
          source: "planet",
          "source-layer": "transportation",
          filter: ["in", ["get", "class"], ["literal", ["path", "track"]]],
          paint: {
            "line-color": "#c53030",
            "line-width": 1.8,
            "line-dasharray": [2, 1.5],
          },
        });

        // OpenMapTiles schema: `mountain_peak` with `name`, `ele`, `class`.
        map.addLayer({
          id: "peaks",
          type: "symbol",
          source: "planet",
          "source-layer": "mountain_peak",
          filter: ["has", "name"],
          layout: {
            "text-field": ["concat", "▲ ", ["get", "name"], "\n", ["to-string", ["get", "ele"]], " m"],
            "text-size": 11,
            "text-font": ["Noto Sans Bold"],
            "text-anchor": "top",
            "text-offset": [0, 0.2],
          },
          paint: { "text-color": "#1a365d", "text-halo-color": "#ffffff", "text-halo-width": 1.2 },
        });

        map.on("click", "peaks", (e) => {
          const feature = e.features && e.features[0];
          if (!feature) return;
          const props = feature.properties || {};
          new maptilersdk.Popup()
            .setLngLat(e.lngLat)
            .setHTML(
              "<strong>" + (props.name || "Unnamed peak") + "</strong><br/>" +
              "Elevation: " + (props.ele ? props.ele + " m" : "unknown") +
              (props.class ? "<br/>Type: " + props.class : "")
            )
            .addTo(map);
        });
        map.on("mouseenter", "peaks", () => { map.getCanvas().style.cursor = "pointer"; });
        map.on("mouseleave", "peaks", () => { map.getCanvas().style.cursor = ""; });
      } catch (error) {
        showError("Failed to add the outdoor overlay layers.", error);
      }
    });

    const TOGGLES = [
      { checkbox: "tog-contours", layers: ["contour-minor", "contour-index", "contour-labels"] },
      { checkbox: "tog-trails", layers: ["hiking-paths"] },
      { checkbox: "tog-peaks", layers: ["peaks"] },
    ];
    for (const group of TOGGLES) {
      document.getElementById(group.checkbox).addEventListener("change", (e) => {
        for (const layerId of group.layers) {
          if (map.getLayer(layerId)) {
            map.setLayoutProperty(layerId, "visibility", e.target.checked ? "visible" : "none");
          }
        }
      });
    }
  </script>
</body>
</html>
