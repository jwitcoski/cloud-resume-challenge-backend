<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Elevation Probe</title>
  <link rel="stylesheet" href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css">
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; }
    #reading { position: fixed; z-index: 2; top: 12px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 48px); padding: 10px 14px; border-radius: 7px; background: #172554e8; color: white; font: 14px system-ui, sans-serif; }
    #reading.error { background: #7f1d1de8; }
  </style>
</head>
<body>
  <div id="map" role="application" aria-label="Topographic map for querying elevation"></div>
  <output id="reading" aria-live="polite">Click the map to measure elevation.</output>
  <script src="../admin-boundaries/js/config.js"></script>
  <script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"></script>
  <script>
    (() => {
      "use strict";
      const reading = document.getElementById("reading");
      const showError = (message, error) => {
        reading.textContent = message;
        reading.className = "error";
        if (error) console.error(message, error);
      };
      const apiKey = typeof window.MAPTILER_API_KEY === "string"
        ? window.MAPTILER_API_KEY.trim()
        : "";
      if (!apiKey) {
        showError("Missing window.MAPTILER_API_KEY in ../admin-boundaries/js/config.js.");
        return;
      }
      if (!window.maptilersdk) {
        showError("MapTiler SDK v4.0.2 failed to load.");
        return;
      }
      maptilersdk.config.apiKey = apiKey;

      let map;
      let marker;
      try {
        map = new maptilersdk.Map({
          container: "map",
          style: maptilersdk.MapStyle.OUTDOOR,
          center: [8.5417, 47.3769],
          zoom: 7,
          navigationControl: true,
          scaleControl: true
        });
        marker = new maptilersdk.Marker({ color: "#be123c" });
      } catch (error) {
        showError(`Map initialization failed: ${error.message || error}`, error);
        return;
      }

      map.on("click", async ({ lngLat }) => {
        const coordinates = [lngLat.lng, lngLat.lat];
        reading.className = "";
        reading.textContent = `Measuring ${coordinates[1].toFixed(5)}, ${coordinates[0].toFixed(5)}…`;
        try {
          const response = await maptilersdk.elevation.at(coordinates);
          const elevation = Array.isArray(response)
            ? response[2]
            : response && (response.elevation ?? response.z);
          if (!Number.isFinite(elevation)) throw new Error("The elevation service returned no numeric height");
          marker.setLngLat(coordinates).addTo(map);
          new maptilersdk.Popup({ closeButton: false, offset: 24 })
            .setLngLat(coordinates)
            .setText(`${Math.round(elevation).toLocaleString()} m above sea level`)
            .addTo(map);
          reading.textContent = `${coordinates[1].toFixed(5)}, ${coordinates[0].toFixed(5)} · ${Math.round(elevation).toLocaleString()} meters`;
        } catch (error) {
          showError(`Elevation lookup failed: ${error.message || error}`, error);
        }
      });
      map.on("load", () => { reading.textContent = "Map ready — click any land location."; });
      map.on("error", ({ error }) => showError(`Map data failed: ${error?.message || error || "Unknown error"}`, error));
      window.addEventListener("beforeunload", () => map.remove(), { once: true });
    })();
  </script>
</body>
</html>
