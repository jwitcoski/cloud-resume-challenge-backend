<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>X8 — Leaflet Hand-off: SDK [lng,lat] beside Leaflet (lat,lng)</title>
  <script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"></script>
  <link href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css" rel="stylesheet" />
  <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../admin-boundaries/js/config.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #duo {
      display: grid; grid-template-columns: 1fr 1fr;
      position: absolute; inset: 0;
    }
    #sdk-map, #leaflet-map { height: 100%; }
    #error-bar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 2000;
      background: #b00020; color: #fff; padding: 10px 14px;
      font: 14px/1.4 system-ui, sans-serif;
    }
    .badge {
      position: absolute; top: 10px; z-index: 1000;
      background: rgba(16, 20, 28, 0.88); color: #eef2f7;
      border-radius: 8px; padding: 6px 10px;
      font: 12px/1.4 system-ui, sans-serif;
    }
    #badge-sdk { left: 10px; }
    #badge-leaflet { left: calc(50% + 10px); }
    .badge code { color: #9fd3ff; }
  </style>
</head>
<body>
  <div id="duo">
    <div id="sdk-map"></div>
    <div id="leaflet-map"></div>
  </div>
  <div id="badge-sdk" class="badge">MapTiler SDK — <code>center: [lng, lat]</code></div>
  <div id="badge-leaflet" class="badge">Leaflet — <code>setView([lat, lng])</code>, views stay in sync</div>
  <div id="error-bar" hidden></div>
  <script>
    "use strict";

    const errorBar = document.getElementById("error-bar");
    function showError(message, error) {
      errorBar.textContent = message;
      errorBar.hidden = false;
      if (error) console.error(message, error);
    }

    const apiKey = window.MAPTILER_API_KEY;
    if (!apiKey || /YOUR_MAPTILER/i.test(apiKey)) {
      showError("Missing MapTiler API key: define window.MAPTILER_API_KEY in ../admin-boundaries/js/config.js before loading this page.");
      throw new Error("Missing MAPTILER_API_KEY");
    }
    maptilersdk.config.apiKey = apiKey;

    if (typeof L === "undefined") {
      showError("Leaflet 1.9.4 failed to load from the CDN — the right-hand map cannot start.");
      throw new Error("Leaflet not available");
    }

    // Vienna. Same place, two conventions:
    //   MapTiler / GeoJSON: [lng, lat]     Leaflet: (lat, lng)
    const VIENNA_LNG = 16.3738;
    const VIENNA_LAT = 48.2082;
    const START_ZOOM = 13;

    const sdkMap = new maptilersdk.Map({
      container: "sdk-map",
      style: maptilersdk.MapStyle.STREETS,
      center: [VIENNA_LNG, VIENNA_LAT],
      zoom: START_ZOOM,
      navigationControl: true,
    });

    sdkMap.on("error", ({ error }) => {
      showError("MapTiler SDK map error: " + (error && error.message ? error.message : "style, tile or WebGL failure — see console."), error);
    });

    const leafletMap = L.map("leaflet-map").setView([48.2082, 16.3738], START_ZOOM);

    // Raster streets-v4 tiles; direct Cloud URLs must carry the key explicitly.
    // 512px tiles need zoomOffset -1 per MapTiler's Leaflet guidance.
    const tileLayer = L.tileLayer(
      "https://api.maptiler.com/maps/streets-v4/{z}/{x}/{y}.png?key=" + encodeURIComponent(apiKey),
      {
        tileSize: 512,
        zoomOffset: -1,
        minZoom: 1,
        maxZoom: 19,
        crossOrigin: true,
        attribution:
          '<a href="https://www.maptiler.com/copyright/" target="_blank">&copy; MapTiler</a> ' +
          '<a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>',
      }
    ).addTo(leafletMap);

    tileLayer.on("tileerror", () => {
      showError("Leaflet tile request failed — check the API key origin restrictions for streets-v4 raster tiles.");
    });

    // One landmark, expressed in each library's native coordinate order.
    const STEPHANSDOM = { lng: 16.3725, lat: 48.2085 };
    new maptilersdk.Marker({ color: "#e53e3e" })
      .setLngLat([STEPHANSDOM.lng, STEPHANSDOM.lat])
      .setPopup(new maptilersdk.Popup().setHTML("<strong>Stephansdom</strong><br/>SDK marker: [lng, lat]"))
      .addTo(sdkMap);
    L.marker([STEPHANSDOM.lat, STEPHANSDOM.lng])
      .bindPopup("<strong>Stephansdom</strong><br/>Leaflet marker: (lat, lng)")
      .addTo(leafletMap);

    // Two-way view sync. The swap happens exactly once, at each boundary.
    let syncing = false;

    sdkMap.on("moveend", () => {
      if (syncing) { syncing = false; return; }
      syncing = true;
      const center = sdkMap.getCenter(); // {lng, lat}
      leafletMap.setView([center.lat, center.lng], Math.round(sdkMap.getZoom()), { animate: false });
    });

    leafletMap.on("moveend", () => {
      if (syncing) { syncing = false; return; }
      syncing = true;
      const center = leafletMap.getCenter(); // L.LatLng: lat first
      sdkMap.jumpTo({ center: [center.lng, center.lat], zoom: leafletMap.getZoom() });
    });
  </script>
</body>
</html>
