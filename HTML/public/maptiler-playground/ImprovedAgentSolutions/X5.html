<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>X5 — Search Then Reverse: forward + debounced reverse geocoding</title>
  <script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"></script>
  <link href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css" rel="stylesheet" />
  <script src="../admin-boundaries/js/config.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #map { position: absolute; inset: 0; height: 100%; }
    #error-bar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 20;
      background: #b00020; color: #fff; padding: 10px 14px;
      font: 14px/1.4 system-ui, sans-serif;
    }
    #panel {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      background: rgba(16, 20, 28, 0.9); color: #eef2f7;
      border-radius: 10px; padding: 12px 14px; width: 320px;
      font: 13px/1.5 system-ui, sans-serif;
    }
    #panel h1 { margin: 0 0 8px; font-size: 15px; }
    #search-row { display: flex; gap: 6px; }
    #q {
      flex: 1; border: 1px solid #4a5568; border-radius: 6px;
      background: #1a202c; color: #eef2f7; padding: 6px 8px; font-size: 13px;
    }
    #search-btn {
      background: #2b6cb0; color: #fff; border: 0; border-radius: 6px;
      padding: 6px 12px; cursor: pointer; font-size: 13px;
    }
    #results { list-style: none; margin: 8px 0 0; padding: 0; }
    #results li {
      padding: 5px 6px; border-radius: 5px; cursor: pointer;
    }
    #results li:hover { background: #2d3748; }
    #reverse-out { margin-top: 8px; color: #9fd3ff; min-height: 2.6em; }
    .hint { color: #a0aec0; font-size: 12px; margin-top: 6px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="error-bar" hidden></div>
  <div id="panel">
    <h1>Search a place, then click the map</h1>
    <div id="search-row">
      <input id="q" type="search" placeholder="e.g. Kyoto Station" autocomplete="off" />
      <button id="search-btn" type="button">Search</button>
    </div>
    <ul id="results"></ul>
    <div id="reverse-out">Click anywhere on the map to reverse-geocode it.</div>
    <div class="hint">Map clicks are debounced (350 ms) so rapid clicks fire one request.</div>
  </div>
  <script>
    "use strict";

    const errorBar = document.getElementById("error-bar");
    function showError(message, error) {
      errorBar.textContent = message;
      errorBar.hidden = false;
      if (error) console.error(message, error);
    }

    const apiKey = window.MAPTILER_API_KEY;
    if (!apiKey || /YOUR_MAPTILER/i.test(apiKey)) {
      showError("Missing MapTiler API key: define window.MAPTILER_API_KEY in ../admin-boundaries/js/config.js before loading this page.");
      throw new Error("Missing MAPTILER_API_KEY");
    }
    maptilersdk.config.apiKey = apiKey;

    const map = new maptilersdk.Map({
      container: "map",
      style: maptilersdk.MapStyle.STREETS,
      center: [14.4178, 50.1167],
      zoom: 4,
      navigationControl: true,
    });

    map.on("error", ({ error }) => {
      showError("Map error: " + (error && error.message ? error.message : "style, tile or WebGL failure — see console."), error);
    });

    const input = document.getElementById("q");
    const resultsList = document.getElementById("results");
    const reverseOut = document.getElementById("reverse-out");

    const searchMarker = new maptilersdk.Marker({ color: "#e53e3e" });
    const clickMarker = new maptilersdk.Marker({ color: "#3182ce" });

    async function runSearch() {
      const query = input.value.trim();
      if (!query) return;
      resultsList.innerHTML = "<li>Searching…</li>";
      try {
        const result = await maptilersdk.geocoding.forward(query, { limit: 5 });
        resultsList.innerHTML = "";
        if (!result.features.length) {
          resultsList.innerHTML = "<li>No results for “" + query + "”.</li>";
          return;
        }
        for (const feature of result.features) {
          const item = document.createElement("li");
          item.textContent = feature.place_name;
          item.addEventListener("click", () => pickResult(feature));
          resultsList.appendChild(item);
        }
        pickResult(result.features[0]);
      } catch (error) {
        resultsList.innerHTML = "";
        showError("Forward geocoding failed (network, quota or key restriction).", error);
      }
    }

    function pickResult(feature) {
      const coordinates = feature.geometry && feature.geometry.coordinates;
      if (!coordinates) return;
      searchMarker
        .setLngLat(coordinates)
        .setPopup(new maptilersdk.Popup().setHTML("<strong>" + feature.place_name + "</strong>"))
        .addTo(map);
      map.flyTo({ center: coordinates, zoom: 14, duration: 2500 });
    }

    document.getElementById("search-btn").addEventListener("click", runSearch);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") runSearch();
    });

    // Debounce map clicks: only the last click within 350 ms hits the API.
    let reverseTimer = null;
    map.on("click", (e) => {
      const { lng, lat } = e.lngLat;
      reverseOut.textContent = "Reverse geocoding " + lat.toFixed(5) + ", " + lng.toFixed(5) + "…";
      clearTimeout(reverseTimer);
      reverseTimer = setTimeout(() => reverseGeocode(lng, lat), 350);
    });

    async function reverseGeocode(lng, lat) {
      try {
        const result = await maptilersdk.geocoding.reverse([lng, lat]);
        const best = result.features && result.features[0];
        const label = best ? best.place_name : "No address found at this location.";
        reverseOut.textContent = label;
        clickMarker
          .setLngLat([lng, lat])
          .setPopup(new maptilersdk.Popup().setHTML(label))
          .addTo(map)
          .togglePopup();
      } catch (error) {
        reverseOut.textContent = "Reverse geocoding failed — see the error bar.";
        showError("Reverse geocoding failed (network, quota or key restriction).", error);
      }
    }
  </script>
</body>
</html>
