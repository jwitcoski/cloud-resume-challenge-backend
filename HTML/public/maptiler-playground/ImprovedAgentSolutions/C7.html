<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prague 3D Buildings</title>
  <link rel="stylesheet" href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css">
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; }
    #status { position: fixed; z-index: 2; left: 12px; top: 12px; max-width: min(430px, calc(100% - 48px)); padding: 9px 12px; border-radius: 7px; background: #1c1917e8; color: white; font: 14px system-ui, sans-serif; }
    #status.error { background: #7f1d1de8; }
  </style>
</head>
<body>
  <div id="map" role="application" aria-label="Three-dimensional buildings in central Prague"></div>
  <output id="status" aria-live="polite">Loading detailed building geometry…</output>
  <script src="../admin-boundaries/js/config.js"></script>
  <script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"></script>
  <script>
    (() => {
      "use strict";
      const status = document.getElementById("status");
      const showError = (message, error) => {
        status.textContent = message;
        status.className = "error";
        if (error) console.error(message, error);
      };
      const apiKey = typeof window.MAPTILER_API_KEY === "string"
        ? window.MAPTILER_API_KEY.trim()
        : "";
      if (!apiKey) {
        showError("Missing window.MAPTILER_API_KEY in ../admin-boundaries/js/config.js.");
        return;
      }
      if (!window.maptilersdk) {
        showError("MapTiler SDK v4.0.2 failed to load.");
        return;
      }
      maptilersdk.config.apiKey = apiKey;

      let map;
      try {
        map = new maptilersdk.Map({
          container: "map",
          style: maptilersdk.MapStyle.STREETS,
          center: [14.4208, 50.0872],
          zoom: 15.5,
          pitch: 60,
          bearing: -22,
          navigationControl: true
        });
      } catch (error) {
        showError(`Map initialization failed: ${error.message || error}`, error);
        return;
      }

      function addBuildings() {
        if (!map.getSource("detailed-buildings")) {
          map.addSource("detailed-buildings", {
            type: "vector",
            url: `https://api.maptiler.com/tiles/buildings/tiles.json?key=${encodeURIComponent(apiKey)}`
          });
        }
        if (map.getLayer("detailed-buildings-3d")) return;
        const labelLayerId = map.getStyle().layers.find((layer) =>
          layer.type === "symbol" && layer.layout && layer.layout["text-field"]
        )?.id;
        map.addLayer({
          id: "detailed-buildings-3d",
          type: "fill-extrusion",
          source: "detailed-buildings",
          "source-layer": "building",
          minzoom: 13,
          paint: {
            "fill-extrusion-color": ["coalesce", ["get", "facade_color"], "#d6d3d1"],
            "fill-extrusion-height": ["coalesce", ["get", "height"], 4],
            "fill-extrusion-base": ["coalesce", ["get", "height_min"], 0],
            "fill-extrusion-opacity": 0.9,
            "fill-extrusion-vertical-gradient": true
          }
        }, labelLayerId);
        status.textContent = "3D buildings ready · drag to rotate and tilt";
      }

      map.on("load", addBuildings);
      map.on("style.load", addBuildings);
      map.on("error", ({ error }) => {
        showError(`Building or map data failed: ${error?.message || error || "Unknown error"}`, error);
      });
      map.on("click", "detailed-buildings-3d", (event) => {
        const feature = event.features && event.features[0];
        if (!feature) return;
        const height = Number(feature.properties.height);
        const description = Number.isFinite(height) ? `Approximate height: ${Math.round(height)} m` : "Height unavailable";
        new maptilersdk.Popup().setLngLat(event.lngLat).setText(description).addTo(map);
      });
      map.on("mouseenter", "detailed-buildings-3d", () => { map.getCanvas().style.cursor = "pointer"; });
      map.on("mouseleave", "detailed-buildings-3d", () => { map.getCanvas().style.cursor = ""; });
      window.addEventListener("beforeunload", () => map.remove(), { once: true });
    })();
  </script>
</body>
</html>
