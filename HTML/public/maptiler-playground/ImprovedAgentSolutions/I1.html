<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MapTiler terrain in CesiumJS</title>
  <script>
    window.CESIUM_BASE_URL = "https://cdn.jsdelivr.net/npm/cesium@1.141.0/Build/Cesium/";
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.141.0/Build/Cesium/Widgets/widgets.css">
  <script src="../admin-boundaries/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.141.0/Build/Cesium/Cesium.js"></script>
  <style>
    html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    #status { position: absolute; z-index: 2; top: 12px; left: 12px; max-width: 28rem; padding: .75rem 1rem; border-radius: .5rem; color: white; background: rgba(15,23,42,.88); font: 14px/1.4 system-ui; }
    #status[data-kind="error"] { background: rgba(127,29,29,.94); }
  </style>
</head>
<body>
  <div id="cesiumContainer" aria-label="Interactive Cesium globe"></div>
  <div id="status" role="status">Initializing CesiumJS 1.141.0…</div>
  <script>
    (() => {
      const status = document.getElementById("status");
      const showStatus = (message, kind = "info") => {
        status.textContent = message;
        status.dataset.kind = kind;
      };

      if (typeof Cesium === "undefined") {
        showStatus("CesiumJS failed to load. Check the CDN connection and content policy.", "error");
        return;
      }

      const apiKey = window.MAPTILER_API_KEY;
      if (typeof apiKey !== "string" || apiKey.trim().length < 8) {
        showStatus("Missing MAPTILER_API_KEY in ../admin-boundaries/js/config.js.", "error");
        return;
      }

      const key = encodeURIComponent(apiKey.trim());
      const terrainUrl =
        `https://api.maptiler.com/tiles/terrain-quantized-mesh-v2/?key=${key}`;
      const imageryUrl =
        `https://api.maptiler.com/maps/satellite-v4/{z}/{x}/{y}.jpg?key=${key}`;

      const terrainProvider = Cesium.CesiumTerrainProvider.fromUrl(terrainUrl, {
        requestVertexNormals: true
      });
      const imageryProvider = new Cesium.UrlTemplateImageryProvider({
        url: imageryUrl,
        minimumLevel: 0,
        maximumLevel: 20,
        tileWidth: 512,
        tileHeight: 512,
        credit: new Cesium.Credit("© MapTiler © OpenStreetMap contributors")
      });

      let viewer;
      try {
        viewer = new Cesium.Viewer("cesiumContainer", {
          terrain: new Cesium.Terrain(terrainProvider),
          baseLayer: new Cesium.ImageryLayer(imageryProvider),
          animation: false,
          baseLayerPicker: false,
          geocoder: false,
          homeButton: true,
          navigationHelpButton: false,
          sceneModePicker: false,
          timeline: false
        });
        viewer.scene.globe.depthTestAgainstTerrain = true;
        viewer.scene.globe.enableLighting = true;
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(8.55, 46.8, 180000),
          orientation: {
            heading: Cesium.Math.toRadians(15),
            pitch: Cesium.Math.toRadians(-35),
            roll: 0
          },
          duration: 2.5
        });
      } catch (error) {
        console.error("Cesium viewer initialization failed:", error);
        showStatus(`Viewer initialization failed: ${error.message || error}`, "error");
        return;
      }

      terrainProvider
        .then(() => showStatus("MapTiler satellite imagery and quantized terrain are ready."))
        .catch((error) => {
          console.error("MapTiler terrain failed:", error);
          showStatus(`Terrain request failed: ${error.message || error}`, "error");
        });

      viewer.scene.renderError.addEventListener((_scene, error) => {
        console.error("Cesium render error:", error);
        showStatus(`Rendering failed: ${error.message || error}`, "error");
      });

      window.addEventListener("beforeunload", () => {
        if (viewer && !viewer.isDestroyed()) viewer.destroy();
      }, { once: true });
    })();
  </script>
</body>
</html>
