<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>X2 — City Extrude Survive: NYC 3D buildings across style swaps</title>
  <script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"></script>
  <link href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css" rel="stylesheet" />
  <script src="../admin-boundaries/js/config.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #map { position: absolute; inset: 0; height: 100%; }
    #error-bar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 20;
      background: #b00020; color: #fff; padding: 10px 14px;
      font: 14px/1.4 system-ui, sans-serif;
    }
    #panel {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      background: rgba(16, 20, 28, 0.88); color: #eef2f7;
      border-radius: 10px; padding: 12px 14px; width: 280px;
      font: 13px/1.5 system-ui, sans-serif;
    }
    #panel h1 { margin: 0 0 8px; font-size: 15px; }
    #panel .row { display: flex; gap: 8px; margin-top: 8px; }
    #panel button {
      flex: 1; background: #2b6cb0; color: #fff; border: 0; border-radius: 6px;
      padding: 7px 10px; cursor: pointer; font-size: 13px;
    }
    #panel button.active { background: #38a169; }
    #status { color: #9fd3ff; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="error-bar" hidden></div>
  <div id="panel">
    <h1>Lower Manhattan in 3D</h1>
    <div>Extrusions come from the specialized <em>buildings</em> tileset and are
      re-added after every <code>setStyle()</code>. Click a building for details.</div>
    <div class="row">
      <button id="btn-hybrid" type="button" class="active">Hybrid</button>
      <button id="btn-streets" type="button">Streets</button>
    </div>
    <div class="row"><span id="status">Buildings: waiting for style…</span></div>
  </div>
  <script>
    "use strict";

    const errorBar = document.getElementById("error-bar");
    function showError(message, error) {
      errorBar.textContent = message;
      errorBar.hidden = false;
      if (error) console.error(message, error);
    }

    const apiKey = window.MAPTILER_API_KEY;
    if (!apiKey || /YOUR_MAPTILER/i.test(apiKey)) {
      showError("Missing MapTiler API key: define window.MAPTILER_API_KEY in ../admin-boundaries/js/config.js before loading this page.");
      throw new Error("Missing MAPTILER_API_KEY");
    }
    maptilersdk.config.apiKey = apiKey;

    // Direct Cloud tile URLs are NOT auto-authenticated by config.apiKey,
    // so the key is appended explicitly.
    const BUILDINGS_TILES_URL =
      "https://api.maptiler.com/tiles/buildings/tiles.json?key=" + encodeURIComponent(apiKey);

    const statusEl = document.getElementById("status");

    const map = new maptilersdk.Map({
      container: "map",
      style: maptilersdk.MapStyle.HYBRID,
      center: [-74.0060, 40.7128],
      zoom: 15.5,
      pitch: 60,
      bearing: -17,
      navigationControl: true,
    });

    map.on("error", ({ error }) => {
      showError("Map error: " + (error && error.message ? error.message : "style, tile or WebGL failure — see console."), error);
    });

    function findLabelLayerId() {
      const layers = map.getStyle().layers || [];
      for (const layer of layers) {
        if (layer.type === "symbol" && layer.layout && layer.layout["text-field"]) {
          return layer.id;
        }
      }
      return undefined;
    }

    function addBuildings() {
      try {
        if (map.getLayer("buildings-3d")) return;
        if (!map.getSource("buildings")) {
          map.addSource("buildings", { type: "vector", url: BUILDINGS_TILES_URL });
        }
        // Specialized buildings schema: height / height_min / facade_color
        // (NOT render_height, which belongs to the planet tileset).
        const labelLayerId = findLabelLayerId();
        map.addLayer({
          id: "buildings-3d",
          type: "fill-extrusion",
          source: "buildings",
          "source-layer": "building",
          minzoom: 13,
          paint: {
            'fill-extrusion-color': ["coalesce", ["get", "facade_color"], "hsl(44, 14%, 79%)"],
            'fill-extrusion-height': [
              "interpolate", ["linear"], ["zoom"],
              13, 0,
              14.5, ["coalesce", ["get", "height"], 10]
            ],
            'fill-extrusion-base': ["coalesce", ["get", "height_min"], 0],
            'fill-extrusion-opacity': 0.88
          }
        }, labelLayerId);
        statusEl.textContent = "Buildings: 3D layer active (under labels).";
      } catch (error) {
        showError("Failed to add the 3D buildings layer.", error);
        statusEl.textContent = "Buildings: failed to load.";
      }
    }

    // Fires on the initial style AND after every setStyle(), which is what
    // keeps the extrusions alive across Streets <-> Hybrid toggles.
    map.on("style.load", addBuildings);

    const btnHybrid = document.getElementById("btn-hybrid");
    const btnStreets = document.getElementById("btn-streets");

    function switchStyle(style, activeBtn, otherBtn) {
      statusEl.textContent = "Buildings: re-adding after style change…";
      map.setStyle(style);
      activeBtn.classList.add("active");
      otherBtn.classList.remove("active");
    }

    btnHybrid.addEventListener("click", () =>
      switchStyle(maptilersdk.MapStyle.HYBRID, btnHybrid, btnStreets));
    btnStreets.addEventListener("click", () =>
      switchStyle(maptilersdk.MapStyle.STREETS, btnStreets, btnHybrid));

    map.on("click", "buildings-3d", (e) => {
      const feature = e.features && e.features[0];
      if (!feature) return;
      const props = feature.properties || {};
      const height = props.height ? Number(props.height).toFixed(0) + " m" : "unknown";
      const base = props.height_min ? Number(props.height_min).toFixed(0) + " m" : "0 m";
      new maptilersdk.Popup()
        .setLngLat(e.lngLat)
        .setHTML(
          "<strong>Building</strong><br/>Height: " + height +
          "<br/>Base: " + base +
          (props.roof_shape ? "<br/>Roof: " + props.roof_shape : "")
        )
        .addTo(map);
    });

    map.on("mouseenter", "buildings-3d", () => { map.getCanvas().style.cursor = "pointer"; });
    map.on("mouseleave", "buildings-3d", () => { map.getCanvas().style.cursor = ""; });
  </script>
</body>
</html>
