<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>X7 — CRS Trap: WGS84 → projected CRS, both labeled</title>
  <script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"></script>
  <link href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css" rel="stylesheet" />
  <script src="../admin-boundaries/js/config.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #map { position: absolute; inset: 0; height: 100%; }
    #error-bar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 20;
      background: #b00020; color: #fff; padding: 10px 14px;
      font: 14px/1.4 system-ui, sans-serif;
    }
    #panel {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      background: rgba(16, 20, 28, 0.9); color: #eef2f7;
      border-radius: 10px; padding: 12px 14px; width: 330px;
      font: 13px/1.5 system-ui, sans-serif;
    }
    #panel h1 { margin: 0 0 8px; font-size: 15px; }
    #panel select {
      width: 100%; margin: 4px 0 8px; border: 1px solid #4a5568; border-radius: 6px;
      background: #1a202c; color: #eef2f7; padding: 5px 6px; font-size: 13px;
    }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; }
    dt { color: #a0aec0; }
    dd { margin: 0; color: #9fd3ff; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .hint { color: #a0aec0; font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="error-bar" hidden></div>
  <div id="panel">
    <h1>Coordinate transformation</h1>
    <label for="target-crs">Target CRS</label>
    <select id="target-crs">
      <option value="3857" selected>EPSG:3857 — Web Mercator (metres)</option>
      <option value="5514">EPSG:5514 — S-JTSK / Krovak (Czech national grid)</option>
    </select>
    <dl>
      <dt id="label-src">EPSG:4326 (WGS84)</dt><dd id="out-wgs84">…</dd>
      <dt id="label-dst">EPSG:3857</dt><dd id="out-target">…</dd>
    </dl>
    <div class="hint">Map APIs always take <code>[lng, lat]</code>; the panel shows
      lat/lng for humans and x/y for the projected CRS. Click the map to move the point.</div>
  </div>
  <script>
    "use strict";

    const errorBar = document.getElementById("error-bar");
    function showError(message, error) {
      errorBar.textContent = message;
      errorBar.hidden = false;
      if (error) console.error(message, error);
    }

    const apiKey = window.MAPTILER_API_KEY;
    if (!apiKey || /YOUR_MAPTILER/i.test(apiKey)) {
      showError("Missing MapTiler API key: define window.MAPTILER_API_KEY in ../admin-boundaries/js/config.js before loading this page.");
      throw new Error("Missing MAPTILER_API_KEY");
    }
    maptilersdk.config.apiKey = apiKey;

    // Prague, in [lng, lat] order as every MapTiler/GeoJSON API expects.
    let currentPoint = [14.4178, 50.1167];

    const map = new maptilersdk.Map({
      container: "map",
      style: maptilersdk.MapStyle.DATAVIZ,
      center: [14.4178, 50.1167],
      zoom: 11,
      navigationControl: true,
    });

    map.on("error", ({ error }) => {
      showError("Map error: " + (error && error.message ? error.message : "style, tile or WebGL failure — see console."), error);
    });

    const marker = new maptilersdk.Marker({ color: "#e53e3e" })
      .setLngLat(currentPoint)
      .setPopup(new maptilersdk.Popup())
      .addTo(map);

    const targetSelect = document.getElementById("target-crs");
    const outWgs84 = document.getElementById("out-wgs84");
    const outTarget = document.getElementById("out-target");
    const labelDst = document.getElementById("label-dst");

    const CRS_NAMES = {
      3857: "EPSG:3857 (Web Mercator)",
      5514: "EPSG:5514 (S-JTSK / Krovak)",
    };

    async function transformAndRender() {
      const [lng, lat] = currentPoint;
      const targetCode = Number(targetSelect.value);
      // Human-readable panel shows latitude first; the URL below uses lng,lat
      // as the Coordinates REST API requires.
      outWgs84.textContent = "lat " + lat.toFixed(6) + "°, lng " + lng.toFixed(6) + "°";
      labelDst.textContent = CRS_NAMES[targetCode] || "EPSG:" + targetCode;
      outTarget.textContent = "transforming…";
      try {
        const url =
          "https://api.maptiler.com/coordinates/transform/" + lng + "," + lat +
          ".json?s_srs=4326&t_srs=" + targetCode + "&key=" + encodeURIComponent(apiKey);
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error("Coordinates API returned HTTP " + response.status);
        }
        const data = await response.json();
        const point = data.results && data.results[0];
        if (!point || typeof point.x !== "number") {
          throw new Error("Coordinates API returned no transformed point");
        }
        const projected = "x " + point.x.toFixed(2) + ", y " + point.y.toFixed(2);
        outTarget.textContent = projected;
        marker.getPopup().setHTML(
          "<strong>Same point, two CRS</strong><br/>" +
          "EPSG:4326 (WGS84): " + lat.toFixed(6) + ", " + lng.toFixed(6) + "<br/>" +
          (CRS_NAMES[targetCode] || "EPSG:" + targetCode) + ": " + projected
        );
      } catch (error) {
        outTarget.textContent = "transformation failed";
        showError("Coordinate transformation failed: " + (error.message || "request error."), error);
      }
    }

    map.on("click", (e) => {
      currentPoint = [e.lngLat.lng, e.lngLat.lat];
      marker.setLngLat(currentPoint);
      transformAndRender();
    });

    targetSelect.addEventListener("change", transformAndRender);

    map.on("load", transformAndRender);
  </script>
</body>
</html>
