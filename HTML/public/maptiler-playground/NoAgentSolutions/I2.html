<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>I2 deck.gl Overlay</title>
<script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"></script>
<link rel="stylesheet" href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css" />
<script src="https://unpkg.com/deck.gl@9.0.38/dist.min.js"></script>
<style>html,body,#map{margin:0;height:100%}#map{position:absolute;inset:0}</style>
</head>
<body>
<div id="map"></div>
<script src="../admin-boundaries/js/config.js"></script>
<script>
maptilersdk.config.apiKey = window.MAPTILER_API_KEY;
const pts = [];
for (let i = 0; i < 300; i++) {
  pts.push({
    position: [2.35 + (Math.random() - 0.5) * 0.15, 48.86 + (Math.random() - 0.5) * 0.1],
    r: 30 + Math.random() * 70
  });
}
const map = new maptilersdk.Map({
  container: "map",
  style: maptilersdk.MapStyle.DATAVIZ.DARK,
  center: [2.35, 48.86],
  zoom: 11,
  pitch: 35
});
const overlay = new deck.MapboxOverlay({
  interleaved: true,
  layers: [
    new deck.ScatterplotLayer({
      id: "sc",
      data: pts,
      getPosition: (d) => d.position,
      getRadius: (d) => d.r,
      getFillColor: [30, 144, 255, 160],
      radiusUnits: "meters"
    })
  ]
});
map.on("load", () => map.addControl(overlay));
</script>
</body>
</html>
