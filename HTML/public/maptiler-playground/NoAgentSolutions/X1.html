<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>X1 Stacked World</title>
<script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"></script>
<link rel="stylesheet" href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css" />
<script src="https://cdn.maptiler.com/maptiler-weather/v3.1.1/maptiler-weather.umd.min.js"></script>
<style>
html,body,#map{margin:0;height:100%}#map{position:absolute;inset:0}
#ui{position:absolute;z-index:1;top:8px;left:8px;display:flex;gap:6px}
</style>
</head>
<body>
<div id="ui">
  <button id="alps">Alps</button>
  <button id="sat">SATELLITE</button>
  <button id="out">OUTDOOR</button>
</div>
<div id="map"></div>
<script src="../admin-boundaries/js/config.js"></script>
<script>
maptilersdk.config.apiKey = window.MAPTILER_API_KEY;
if (!maptilersdk.config.apiKey) throw new Error("Set window.MAPTILER_API_KEY in ../admin-boundaries/js/config.js");
let wind;
const map = new maptilersdk.Map({
  container: "map",
  style: maptilersdk.MapStyle.SATELLITE,
  projection: "globe",
  halo: true,
  space: true,
  terrain: true,
  terrainExaggeration: 2.2,
  center: [0, 15],
  zoom: 1.6
});

function stack() {
  if (typeof map.enableTerrain === "function") map.enableTerrain(2.2);
  if (wind) { try { map.removeLayer(wind.id || "wind"); } catch (e) {} }
  wind = new maptilerweather.WindLayer({ id: "wind" });
  map.addLayer(wind);
}

map.on("load", () => {
  stack();
  map.flyTo({ center: [8.0, 46.5], zoom: 9, pitch: 50, duration: 4500 });
});
map.on("style.load", stack);

document.getElementById("alps").onclick = () =>
  map.flyTo({ center: [7.66, 45.98], zoom: 12, pitch: 60, duration: 3000 });
document.getElementById("sat").onclick = () => map.setStyle(maptilersdk.MapStyle.SATELLITE);
document.getElementById("out").onclick = () => map.setStyle(maptilersdk.MapStyle.OUTDOOR);
</script>
</body>
</html>
