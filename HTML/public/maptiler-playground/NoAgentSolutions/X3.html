<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>X3 Store Locator 5k</title>
<script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"></script>
<link rel="stylesheet" href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css" />
<style>
html,body,#map{margin:0;height:100%}#map{position:absolute;inset:0}
#ui{position:absolute;z-index:1;top:10px;left:10px;background:#fff;padding:8px}
</style>
</head>
<body>
<div id="ui"><label><input type="checkbox" id="heat" /> heatmap</label></div>
<div id="map"></div>
<script src="../admin-boundaries/js/config.js"></script>
<script>
maptilersdk.config.apiKey = window.MAPTILER_API_KEY;
if (!maptilersdk.config.apiKey) throw new Error("Set window.MAPTILER_API_KEY in ../admin-boundaries/js/config.js");
const features = [];
for (let i = 0; i < 5000; i++) {
  features.push({
    type: "Feature",
    properties: { name: "Store " + i },
    geometry: {
      type: "Point",
      coordinates: [-120 + Math.random() * 50, 30 + Math.random() * 18]
    }
  });
}
const stores = { type: "FeatureCollection", features };
const map = new maptilersdk.Map({
  container: "map",
  style: maptilersdk.MapStyle.STREETS,
  center: [-98, 39],
  zoom: 3.2
});
map.on("load", async () => {
  await maptilersdk.helpers.addPoint(map, {
    data: stores,
    cluster: true,
    showLabel: true,
    pointColor: "#2a9d8f",
    pointRadius: 4
  });
  map.addSource("heatSrc", { type: "geojson", data: stores });
  map.addLayer({
    id: "heatL",
    type: "heatmap",
    source: "heatSrc",
    layout: { visibility: "none" },
    paint: { "heatmap-radius": 16, "heatmap-opacity": 0.7 }
  });
  map.on("click", (e) => {
    const hits = map.queryRenderedFeatures(e.point);
    const f = hits.find((x) => x.properties && x.properties.name);
    if (!f) return;
    new maptilersdk.Popup()
      .setLngLat(f.geometry.coordinates)
      .setHTML("<b>" + f.properties.name + "</b>")
      .addTo(map);
  });
});
document.getElementById("heat").onchange = (ev) => {
  map.setLayoutProperty("heatL", "visibility", ev.target.checked ? "visible" : "none");
};
</script>
</body>
</html>
