<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>C8 Weather Layer</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"></script>
<link rel="stylesheet" href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css" />
<script src="https://cdn.maptiler.com/maptiler-weather/v3.1.1/maptiler-weather.umd.min.js"></script>
<style>
html,body,#map{margin:0;height:100%}#map{position:absolute;inset:0}
#t{position:absolute;z-index:1;top:10px;left:10px;background:rgba(0,0,0,.7);color:#fff;padding:8px}
</style>
</head>
<body>
<div id="t">@maptiler/weather 3.1.1 wind</div>
<div id="map"></div>
<script src="../admin-boundaries/js/config.js"></script>
<script>
maptilersdk.config.apiKey = window.MAPTILER_API_KEY;
if (!maptilersdk.config.apiKey) {
  throw new Error("Set window.MAPTILER_API_KEY in ../admin-boundaries/js/config.js");
}
const map = new maptilersdk.Map({
  container: "map",
  style: maptilersdk.MapStyle.BACKDROP || maptilersdk.MapStyle.DATAVIZ.DARK,
  center: [0, 30],
  zoom: 2
});
const wind = new maptilerweather.WindLayer({ id: "wind" });
map.on("load", () => {
  map.addLayer(wind);
  if (wind.animateByFactor) wind.animateByFactor(3600);
});
</script>
</body>
</html>
