<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>I1 Cesium Globe</title>
<script>window.CESIUM_BASE_URL = "https://cdn.jsdelivr.net/npm/cesium@1.141.0/Build/Cesium/";</script>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.141.0/Build/Cesium/Cesium.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.141.0/Build/Cesium/Widgets/widgets.css" />
<style>html,body,#c{margin:0;width:100%;height:100%;overflow:hidden}</style>
</head>
<body>
<div id="c"></div>
<script src="../admin-boundaries/js/config.js"></script>
<script>
(async () => {
  const key = window.MAPTILER_API_KEY;
  if (!key) throw new Error("Missing MAPTILER_API_KEY");
  Cesium.Ion.defaultAccessToken = undefined;

  const terrain = await Cesium.CesiumTerrainProvider.fromUrl(
    "https://api.maptiler.com/tiles/terrain-quantized-mesh-v2/?key=" + encodeURIComponent(key)
  );
  const imagery = new Cesium.UrlTemplateImageryProvider({
    url: "https://api.maptiler.com/maps/satellite-v4/{z}/{x}/{y}.jpg?key=" + encodeURIComponent(key),
    maximumLevel: 20
  });

  const viewer = new Cesium.Viewer("c", {
    animation: false,
    timeline: false,
    baseLayerPicker: false,
    geocoder: false,
    imageryProvider: false,
    baseLayer: new Cesium.ImageryLayer(imagery),
    terrainProvider: terrain
  });
  viewer.camera.setView({
    destination: Cesium.Cartesian3.fromDegrees(14.4178, 50.1167, 2000000)
  });
})();
</script>
</body>
</html>
