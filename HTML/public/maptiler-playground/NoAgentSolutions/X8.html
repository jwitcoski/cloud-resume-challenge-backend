<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>X8 Leaflet Hand-off</title>
<script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"></script>
<link rel="stylesheet" href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
html,body{margin:0;height:100%}
#grid{display:grid;grid-template-columns:1fr 1fr;height:100vh}
#a,#b{width:100%;height:100%}
.cap{position:absolute;z-index:400;top:6px;left:6px;background:#fff;padding:4px 8px;font:12px sans-serif}
.cell{position:relative}
</style>
</head>
<body>
<div id="grid">
  <div class="cell"><div class="cap">SDK [lng,lat]</div><div id="a"></div></div>
  <div class="cell"><div class="cap">Leaflet setView(lat,lng) streets-v4</div><div id="b"></div></div>
</div>
<script src="../admin-boundaries/js/config.js"></script>
<script>
maptilersdk.config.apiKey = window.MAPTILER_API_KEY;
if (!maptilersdk.config.apiKey) throw new Error("Set window.MAPTILER_API_KEY in ../admin-boundaries/js/config.js");
const key = window.MAPTILER_API_KEY;
const lngLat = [14.4178, 50.1167];
const latLng = [50.1167, 14.4178];

const sdk = new maptilersdk.Map({
  container: "a",
  style: maptilersdk.MapStyle.STREETS,
  center: lngLat,
  zoom: 12
});
new maptilersdk.Marker().setLngLat(lngLat).addTo(sdk);

const leaf = L.map("b").setView(latLng, 12);
L.tileLayer(
  "https://api.maptiler.com/maps/streets-v4/{z}/{x}/{y}.png?key=" + encodeURIComponent(key),
  { tileSize: 512, zoomOffset: -1, maxZoom: 20, attribution: "&copy; MapTiler" }
).addTo(leaf);
L.marker(latLng).addTo(leaf);
</script>
</body>
</html>
