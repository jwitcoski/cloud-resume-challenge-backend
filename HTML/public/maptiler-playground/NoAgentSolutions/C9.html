<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>C9 Helper Heatmap</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"></script>
<link rel="stylesheet" href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css" />
<style>html,body,#map{margin:0;height:100%}#map{position:absolute;inset:0}</style>
</head>
<body>
<div id="map"></div>
<script src="../admin-boundaries/js/config.js"></script>
<script>
maptilersdk.config.apiKey = window.MAPTILER_API_KEY;
if (!maptilersdk.config.apiKey) {
  throw new Error("Set window.MAPTILER_API_KEY in ../admin-boundaries/js/config.js");
}
const feats = [];
for (let i = 0; i < 180; i++) {
  feats.push({
    type: "Feature",
    properties: { w: Math.random() },
    geometry: {
      type: "Point",
      coordinates: [
        -73.99 + (Math.random() - 0.5) * 0.12,
        40.73 + (Math.random() - 0.5) * 0.08
      ]
    }
  });
}
const fc = { type: "FeatureCollection", features: feats };
const map = new maptilersdk.Map({
  container: "map",
  style: maptilersdk.MapStyle.DATAVIZ.DARK,
  center: [-73.99, 40.73],
  zoom: 11
});
map.on("load", async () => {
  await maptilersdk.helpers.addHeatmap(map, { data: fc, radius: 28, opacity: 0.75 });
  await maptilersdk.helpers.addPoint(map, {
    data: fc,
    cluster: true,
    pointColor: "#ffcc00",
    pointRadius: 5,
    showLabel: true
  });
});
</script>
</body>
</html>
