<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>X4 Route Profile</title>
<script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"></script>
<link rel="stylesheet" href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css" />
<style>
html,body,#map{margin:0;height:100%}#map{position:absolute;inset:0}
#s{position:absolute;z-index:1;top:10px;left:10px;background:#fff;padding:10px}
</style>
</head>
<body>
<div id="s">
  min <span id="min">?</span> · max <span id="max">?</span> · gain <span id="gain">?</span>
</div>
<div id="map"></div>
<script src="../admin-boundaries/js/config.js"></script>
<script>
maptilersdk.config.apiKey = window.MAPTILER_API_KEY;
if (!maptilersdk.config.apiKey) throw new Error("Set window.MAPTILER_API_KEY in ../admin-boundaries/js/config.js");
const line = [
  [7.60, 45.94], [7.63, 45.96], [7.66, 45.98], [7.69, 46.00], [7.72, 46.02]
];
const map = new maptilersdk.Map({
  container: "map",
  style: maptilersdk.MapStyle.OUTDOOR,
  center: [7.66, 45.98],
  zoom: 11,
  pitch: 45,
  terrain: true
});
map.on("load", async () => {
  map.addSource("rt", {
    type: "geojson",
    data: { type: "Feature", geometry: { type: "LineString", coordinates: line }, properties: {} }
  });
  map.addLayer({
    id: "rtL",
    type: "line",
    source: "rt",
    paint: { "line-color": "#e76f51", "line-width": 4 }
  });

  let samples;
  if (maptilersdk.elevation.fromLineString) {
    samples = await maptilersdk.elevation.fromLineString(line, { samples: 40 });
  } else if (maptilersdk.elevation.batch) {
    samples = await maptilersdk.elevation.batch(line);
  } else {
    samples = [];
    for (const p of line) samples.push(await maptilersdk.elevation.at(p));
  }
  const elevs = samples.map((s) => Array.isArray(s) ? s[2] : (s.elevation != null ? s.elevation : s))
    .filter((n) => typeof n === "number");
  let min = elevs[0], max = elevs[0], gain = 0;
  for (let i = 0; i < elevs.length; i++) {
    min = Math.min(min, elevs[i]);
    max = Math.max(max, elevs[i]);
    if (i && elevs[i] > elevs[i - 1]) gain += elevs[i] - elevs[i - 1];
  }
  document.getElementById("min").textContent = min.toFixed(0);
  document.getElementById("max").textContent = max.toFixed(0);
  document.getElementById("gain").textContent = gain.toFixed(0);
});
</script>
</body>
</html>
