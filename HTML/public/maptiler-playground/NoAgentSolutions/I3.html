<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>I3 GeoSplats WebGPU</title>
<link rel="stylesheet" href="https://cdn.maptiler.com/maptiler-geosplats/v1.0.4/maptiler-geosplats.css" />
<style>
html,body{margin:0;height:100%}#map{width:100%;height:100vh}
#fb{display:none;position:absolute;z-index:9;top:16px;left:50%;transform:translateX(-50%);
  background:#b71c1c;color:#fff;padding:12px 18px;border-radius:8px;max-width:90vw;text-align:center}
</style>
</head>
<body>
<div id="fb"></div>
<div id="map"></div>
<script src="../admin-boundaries/js/config.js"></script>
<script type="module">
import { Map, SplatModel, config } from "https://cdn.maptiler.com/maptiler-geosplats/v1.0.4/maptiler-geosplats.mjs";

const key = window.MAPTILER_API_KEY;
const fb = document.getElementById("fb");
if (!navigator.gpu) {
  fb.style.display = "block";
  fb.textContent = "WebGPU unavailable — GeoSplats requires a WebGPU-capable browser.";
}
config.apiKey = key;
const center = [14.42, 50.09];
const map = new Map({ apiKey: key, container: "map", center, zoom: 16, pitch: 45 });
map.on("load", () => {
  if (!navigator.gpu) return;
  map.addSplatModel(new SplatModel({
    model: "7d943f61-56fc-44fe-aa9e-db4afa115813",
    center,
    opacity: 1
  }));
});
</script>
</body>
</html>
