<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>X5 Search Then Reverse</title>
<script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"></script>
<link rel="stylesheet" href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css" />
<style>
html,body,#map{margin:0;height:100%}#map{position:absolute;inset:0}
#ui{position:absolute;z-index:1;top:10px;left:10px;background:#fff;padding:10px;width:260px}
input{width:100%;box-sizing:border-box;margin-bottom:6px}
</style>
</head>
<body>
<div id="ui">
  <input id="q" placeholder="search place" />
  <button id="go">Search</button>
  <p id="st">map click → reverse (debounced)</p>
</div>
<div id="map"></div>
<script src="../admin-boundaries/js/config.js"></script>
<script>
maptilersdk.config.apiKey = window.MAPTILER_API_KEY;
if (!maptilersdk.config.apiKey) throw new Error("Set window.MAPTILER_API_KEY in ../admin-boundaries/js/config.js");
const st = document.getElementById("st");
let mk, t;
const map = new maptilersdk.Map({
  container: "map",
  style: maptilersdk.MapStyle.STREETS,
  center: [14.42, 50.08],
  zoom: 11
});
function pin(ll, label) {
  if (!mk) mk = new maptilersdk.Marker({ color: "#6a4c93" }).addTo(map);
  mk.setLngLat(ll);
  if (label) mk.setPopup(new maptilersdk.Popup().setText(label)).togglePopup();
}
async function forward() {
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  const res = await maptilersdk.geocoding.forward(q, { limit: 1 });
  const f = res.features && res.features[0];
  if (!f) { st.textContent = "no results"; return; }
  const [lng, lat] = f.geometry.coordinates;
  pin([lng, lat], f.place_name || q);
  map.flyTo({ center: [lng, lat], zoom: 14 });
  st.textContent = f.place_name || q;
}
document.getElementById("go").onclick = forward;
document.getElementById("q").onkeydown = (e) => { if (e.key === "Enter") forward(); };
map.on("click", (e) => {
  clearTimeout(t);
  t = setTimeout(async () => {
    const ll = [e.lngLat.lng, e.lngLat.lat];
    const res = await maptilersdk.geocoding.reverse(ll);
    const f = res.features && res.features[0];
    const name = (f && (f.place_name || f.text)) || "unknown";
    pin(ll, name);
    st.textContent = "reverse: " + name;
  }, 400);
});
</script>
</body>
</html>
