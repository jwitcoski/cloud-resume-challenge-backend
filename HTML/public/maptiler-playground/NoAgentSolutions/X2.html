<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>X2 City Extrude Survive</title>
<script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"></script>
<link rel="stylesheet" href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css" />
<style>
html,body,#map{margin:0;height:100%}#map{position:absolute;inset:0}
#ui{position:absolute;z-index:1;top:10px;left:10px}
</style>
</head>
<body>
<div id="ui">
  <button id="hyb">Hybrid</button>
  <button id="str">Streets</button>
</div>
<div id="map"></div>
<script src="../admin-boundaries/js/config.js"></script>
<script>
maptilersdk.config.apiKey = window.MAPTILER_API_KEY;
if (!maptilersdk.config.apiKey) throw new Error("Set window.MAPTILER_API_KEY in ../admin-boundaries/js/config.js");
const map = new maptilersdk.Map({
  container: "map",
  style: maptilersdk.MapStyle.HYBRID,
  center: [-74.006, 40.7128],
  zoom: 15.3,
  pitch: 60
});

function buildings() {
  if (map.getLayer("nyc3d")) map.removeLayer("nyc3d");
  if (map.getSource("nycB")) map.removeSource("nycB");
  map.addSource("nycB", {
    type: "vector",
    url: "https://api.maptiler.com/tiles/buildings/tiles.json"
  });
  map.addLayer({
    id: "nyc3d",
    type: "fill-extrusion",
    source: "nycB",
    "source-layer": "building",
    minzoom: 14,
    paint: {
      "fill-extrusion-color": "#c9b59a",
      "fill-extrusion-height": ["coalesce", ["get", "height"], ["get", "render_height"], 10],
      "fill-extrusion-base": ["coalesce", ["get", "height_min"], 0],
      "fill-extrusion-opacity": 0.9
    }
  });
}
map.on("load", buildings);
map.on("style.load", buildings);
document.getElementById("hyb").onclick = () => map.setStyle(maptilersdk.MapStyle.HYBRID);
document.getElementById("str").onclick = () => map.setStyle(maptilersdk.MapStyle.STREETS);
</script>
</body>
</html>
