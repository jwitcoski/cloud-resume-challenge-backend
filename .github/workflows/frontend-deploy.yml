name: Frontend Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'HTML/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: HTML/package-lock.json

    - name: Install and build Next.js (static export)
      run: |
        cd HTML
        npm ci
        npm run build

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Deploy static site to S3
      run: |
        # Keep /pitchprice/ (PitchPrice2026 app) when syncing the resume site
        aws s3 sync HTML/out s3://witcoskitech.com --delete --exclude "pitchprice/*"

    - name: Invalidate CloudFront Distribution
      env:
        DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
      run: |
        aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"
