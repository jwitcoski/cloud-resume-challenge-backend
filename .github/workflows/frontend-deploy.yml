name: Frontend Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'HTML/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: HTML/package-lock.json

    - name: Install and build Next.js (static export)
      run: |
        cd HTML
        {
          echo "// Injected by GitHub Actions — do not commit"
          if [ -n "${{ secrets.MAPTILER_API_KEY }}" ]; then
            echo "window.MAPTILER_API_KEY = \"${{ secrets.MAPTILER_API_KEY }}\";"
          else
            echo "::warning::MAPTILER_API_KEY secret not set" >&2
            echo "window.MAPTILER_API_KEY = \"YOUR_MAPTILER_KEY_HERE\";"
          fi
          if [ -n "${{ secrets.MAPBOX_ACCESS_TOKEN }}" ]; then
            echo "window.MAPBOX_ACCESS_TOKEN = \"${{ secrets.MAPBOX_ACCESS_TOKEN }}\";"
          else
            echo "::warning::MAPBOX_ACCESS_TOKEN secret not set" >&2
            echo "window.MAPBOX_ACCESS_TOKEN = \"YOUR_MAPBOX_ACCESS_TOKEN\";"
          fi
        } > public/admin-boundaries/js/config.js
        # Sanity: config must be valid JS (no Actions annotations leaked into the file)
        if grep -q '^::' public/admin-boundaries/js/config.js; then
          echo "::error::config.js contains Actions log commands — aborting"
          cat public/admin-boundaries/js/config.js >&2
          exit 1
        fi
        npm ci
        npm run build

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Deploy static site to S3
      run: |
        aws s3 sync HTML/out s3://witcoskitech.com --delete --exclude "pitchprice/*" --exclude "study-lab/*"

    - name: Sync study quizzes to S3 (quiz JSON only — preserves other study-lab artifacts)
      run: |
        aws s3 sync HTML/out/study-lab s3://witcoskitech.com/study-lab \
          --exclude "*" \
          --include "night-*-quiz.json" \
          --include "night-*-quiz-answers.json" \
          --include "quiz-manifest.json"

    - name: Invalidate CloudFront Distribution
      env:
        DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
      run: |
        aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"
